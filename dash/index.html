<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>iTow TowOS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --navy:#1F3864; --navy2:#2a4a80; --bg:#f4f6fa; --card:#ffffff;
    --ink:#16213a; --mut:#6b7690; --line:#e3e8f0;
    --green:#1d7a4d; --amber:#b45f06; --red:#b3261e; --chip:#eef2f9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);padding-bottom:40px}
  header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:11px;opacity:.75;margin-top:2px}
  .tabs{display:flex;margin-top:12px}
  .tab{flex:1;text-align:center;padding:11px 0;font-size:12.5px;font-weight:600;
       color:#c9d4e8;border-bottom:3px solid transparent;cursor:pointer;user-select:none}
  .tab.on{color:#fff;border-bottom-color:#fff}
  main{padding:14px 12px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px;margin-bottom:10px;cursor:pointer}
  .card:active{background:#f7f9fd}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nm{font-size:16px;font-weight:700}
  .meta{font-size:13px;color:var(--mut);margin-top:3px}
  .chip{display:inline-block;background:var(--chip);color:var(--navy);border-radius:99px;
        padding:3px 10px;font-size:12px;font-weight:600}
  .chip.warn{background:#fdecea;color:var(--red)}
  .chip.ok{background:#e7f4ec;color:var(--green)}
  .chip.dim{background:#eee;color:#888}
  .secthead{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;
            letter-spacing:.6px;margin:18px 4px 8px}
  /* driver picker chips */
  .picker{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
  .pchip{flex:0 0 auto;padding:9px 15px;border-radius:99px;background:var(--card);
         border:1.5px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .pchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  /* week grid */
  .day{display:flex;align-items:center;justify-content:space-between;background:var(--card);
       border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:7px;cursor:pointer}
  .day:active{background:#f7f9fd}
  .day .dd{font-weight:700;font-size:14px;width:44px}
  .day .tt{font-size:14px;flex:1;text-align:left}
  .day .tt.offday{color:var(--mut)}
  .day .un{font-size:12px;color:var(--mut)}
  .exline{display:flex;align-items:center;justify-content:space-between;background:var(--card);
          border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:6px}
  .exline .x{color:var(--red);font-size:20px;padding:4px 8px;cursor:pointer;font-weight:700}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--navy);
       color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .btn.sec{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .btn:disabled{opacity:.5}
  .chip.amber{background:#fff3e0;color:var(--amber)}
  /* today board */
  .tdhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
  .tdhead span{font-weight:700;font-size:15px}
  .tdhead .rf{border:1.5px solid var(--line);background:var(--card);border-radius:10px;
              font-size:14px;padding:8px 16px;color:var(--navy);font-weight:700;cursor:pointer}
  .tcard{cursor:default}
  .tcard .sched{font-size:13px;color:var(--mut)}
  .tcard .act{font-size:13px;margin-top:3px}
  .tcard .act b{font-weight:700}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:40;display:none}
  .ov.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
         z-index:50;padding:18px 16px 26px;max-height:88vh;overflow-y:auto;display:none;
         max-width:640px;margin:0 auto}
  .sheet.show{display:block}
  .sheet h3{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px;
        text-transform:uppercase;letter-spacing:.5px}
  input,select{width:100%;padding:13px 12px;font-size:16px;border:1.5px solid var(--line);
               border-radius:10px;background:#fff;color:var(--ink)}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
         color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;z-index:99;display:none;
         max-width:90vw;text-align:center}
  .spin{position:fixed;inset:0;z-index:98;display:none;align-items:center;justify-content:center;
        background:rgba(255,255,255,.5)}
  .spin.show{display:flex;flex-direction:column;gap:12px}
  .spintxt{font-size:14px;font-weight:600;color:var(--navy);text-align:center}
  .spin div{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--navy);
            border-radius:50%;animation:r 0.8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .empty{color:var(--mut);font-size:14px;text-align:center;padding:22px 0}
  /* shifts */
  .wknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
  .wknav span{font-weight:700;font-size:15px}
  .wkbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;
         font-size:20px;padding:5px 18px;color:var(--navy);font-weight:700;cursor:pointer}
  .wkbtn:disabled{opacity:.35}
  .shift .hrs{font-weight:700}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;margin-left:6px}
  .tag.open{background:#fff3e0;color:var(--amber)}
  .tag.zero{background:#fdecea;color:var(--red)}
  /* settings */
  .knob{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .knob .kdesc{font-size:14px;font-weight:600}
  .knob .kkey{font-size:11px;color:var(--mut);margin:2px 0 10px;font-family:ui-monospace,SFMono-Regular,monospace}
  .krow{display:flex;gap:8px;align-items:center}
  .krow input{flex:1}
  .kbtn{flex:0 0 auto;padding:12px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
  .switch{width:56px;height:32px;border-radius:99px;background:#ccd4e2;position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
  .switch.on{background:var(--green)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on::after{left:27px}
  .enumrow{display:flex;gap:6px}
  .echip{flex:1;text-align:center;padding:11px 0;border-radius:10px;border:1.5px solid var(--line);
         background:var(--card);font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
  .echip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .knob.locked{opacity:.75;background:#f7f8fb}
  .lockval{font-size:14px;font-weight:600;color:var(--ink);word-break:break-all}
  .kinfo{float:right;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
         background:var(--card);color:var(--mut);font-weight:700;font-size:13px;line-height:21px;
         text-align:center;cursor:pointer}
  .khelp{display:none;font-size:13px;color:var(--mut);background:var(--chip);border-radius:8px;
         padding:9px 11px;margin:0 0 10px;line-height:1.45}
  .khelp.show{display:block}
</style>
</head>
<body>
<header>
  <h1>iTow · TowOS</h1>
  <div class="sub" id="me"></div>
  <div class="tabs">
    <div class="tab on" id="tabT" onclick="showTab('today')">Today</div>
    <div class="tab" id="tabR" onclick="showTab('roster')">Roster</div>
    <div class="tab" id="tabS" onclick="showTab('sched')">Schedule</div>
    <div class="tab" id="tabH" onclick="showTab('shifts')">Shifts</div>
    <div class="tab" id="tabC" onclick="showTab('settings')">Settings</div>
  </div>
</header>

<main>
  <div id="vToday">
    <div class="tdhead">
      <span id="tdLabel"></span>
      <button class="rf" onclick="loadToday(true)">&#8635; Refresh</button>
    </div>
    <div id="todayList"><div class="empty">Loading&hellip;</div></div>
  </div>
  <div id="vRoster" style="display:none"></div>
  <div id="vSched" style="display:none">
    <div class="picker" id="picker"></div>
    <div class="secthead">Standing week (Fri–Thu)</div>
    <div id="week"></div>
    <button class="btn" onclick="openExc()">+ Time off / exception</button>
    <div class="secthead">Upcoming exceptions</div>
    <div id="excList"></div>
  </div>
  <div id="vShifts" style="display:none">
    <div class="wknav">
      <button class="wkbtn" onclick="wkNav(-1)">&#8249;</button>
      <span id="wkLabel"></span>
      <button class="wkbtn" id="wkFwd" onclick="wkNav(1)">&#8250;</button>
    </div>
    <div class="picker" id="pickerH"></div>
    <div id="shiftList"></div>
  </div>
  <div id="vSettings" style="display:none">
    <div class="secthead">System settings &mdash; changes take effect immediately</div>
    <div id="cfgList"></div>
  </div>
</main>

<!-- driver editor -->
<div class="ov" id="ov" onclick="closeSheets()"></div>
<div class="sheet" id="shDriver">
  <h3 id="dTitle"></h3>
  <label>Preferred name</label><input id="dPref">
  <label>Phone</label><input id="dPhone" inputmode="tel">
  <div class="two">
    <div><label>Role</label><select id="dRole"></select></div>
    <div><label>Notify tier</label><select id="dTier"></select></div>
  </div>
  <label>Status</label><select id="dStatus"></select>
  <label>Add SMS alias (what people call them in texts)</label>
  <div class="two"><div><input id="dAlias" placeholder="e.g. kyle"></div>
    <div style="flex:0 0 90px"><button class="btn sec" style="margin:0;padding:13px" onclick="addAlias()">Add</button></div></div>
  <button class="btn" onclick="saveDriver()">Save</button>
  <button class="btn sec" onclick="closeSheets()">Cancel</button>
</div>

<!-- day editor -->
<div class="sheet" id="shDay">
  <h3 id="dayTitle"></h3>
  <label>Apply to days</label>
  <div class="picker" id="dayChips" style="padding-bottom:4px"></div>
  <div class="two">
    <div><label>Start</label><input type="time" id="dayStart"></div>
    <div><label>End</label><input type="time" id="dayEnd"></div>
  </div>
  <label>Truck (optional)</label><select id="dayUnit"></select>
  <button class="btn" onclick="saveDay()">Save day</button>
  <button class="btn danger" onclick="clearDay()">Clear day (not scheduled)</button>
  <button class="btn sec" onclick="closeSheets()">Cancel</button>
</div>

<!-- exception -->
<div class="sheet" id="shExc">
  <h3 id="excTitle">Time off / exception</h3>
  <label>Driver</label><select id="excDriver"></select>
  <label>Type</label>
  <select id="excType" onchange="excTypeChange()">
    <option value="OFF">Off (not working)</option>
    <option value="SHIFT_CHANGE">Different hours that day</option>
    <option value="EXTRA_SHIFT">Extra shift (not normally scheduled)</option>
  </select>
  <div class="two">
    <div><label>From date</label><input type="date" id="excFrom"></div>
    <div><label>To date (same day = one day)</label><input type="date" id="excTo"></div>
  </div>
  <div id="excTimes" style="display:none" class="two">
    <div><label>Start</label><input type="time" id="excStart"></div>
    <div><label>End</label><input type="time" id="excEnd"></div>
  </div>
  <label>Reason (optional)</label><input id="excReason" placeholder="e.g. vacation, back Mon 8/10">
  <button class="btn" onclick="fileExc()">File it</button>
  <button class="btn sec" onclick="closeSheets()">Cancel</button>
</div>

<!-- shift editor -->
<div class="sheet" id="shShift">
  <h3 id="sTitle"></h3>
  <div class="meta" id="sMeta" style="margin-bottom:2px"></div>
  <div class="two">
    <div><label>Clock in</label><input type="time" id="sIn"></div>
    <div><label>Clock out</label><input type="time" id="sOut"></div>
  </div>
  <label>Reason (goes in the audit trail)</label><input id="sReason" placeholder="e.g. forgot to punch out">
  <button class="btn" onclick="saveShift()">Save times</button>
  <button class="btn sec" id="sReopenBtn" onclick="reopenShift()">Reopen (clear clock-out)</button>
  <button class="btn danger" onclick="deleteShift()">Delete shift</button>
  <button class="btn sec" onclick="closeSheets()">Cancel</button>
</div>

<div class="toast" id="toast"></div>
<div class="spin" id="spin"><div></div><div id="spinTxt" class="spintxt"></div></div>

<div class="ov show" id="loginOv" style="background:var(--bg)">
  <div style="position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;width:300px">
    <h2 style="color:var(--navy);margin:0 0 4px">iTow · TowOS</h2>
    <p style="color:var(--mut);font-size:14px;margin:0 0 22px">Sign in to continue</p>
    <div id="gbtn" style="display:flex;justify-content:center"></div>
    <p id="loginMsg" style="color:var(--red);font-size:13px;min-height:18px"></p>
  </div>
</div>

<script>
/* ====== CONFIG — fill these two lines, then commit ====== */
var API_URL   = "https://script.google.com/macros/s/AKfycbxB9ymqvQWNa86CM0AkSRHRsb0XZ14bHKS98wCw6pCEwDeUmvEPIVAdIvlPeuC39kizkQ/exec";   // ends in /exec
var CLIENT_ID = "467184176739-4houlseq386a35ufvc4ed8p96q92pmug.apps.googleusercontent.com";

// true  = sign-in required on EVERY page load; nothing persists across
//         refreshes. Use for auth testing (try different Google accounts
//         by refreshing between attempts).
// false = original behavior: session + cached data survive refreshes
//         within the same tab; fresh opens still require a tap.
var FORCE_LOGIN = true;

/* ======================================================== */

var CRED = null;         // Google ID token for this session
function KEYV(){ return 'tok:' + CRED }

function jwtExpMs(tok){
  try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp * 1000 }
  catch(e){ return 0 }
}
function showLogin(msg){
  document.getElementById('loginOv').style.display = 'block';
  if (msg) document.getElementById('loginMsg').textContent = msg;
}
function hideLogin(){ document.getElementById('loginOv').style.display = 'none' }

function onCred(resp){
  CRED = resp.credential;
  if (!FORCE_LOGIN) {
    try { sessionStorage.setItem('towos_cred', CRED) } catch(e){}
  }
  // Login overlay stays up until the server ACCEPTS the account —
  // unauthorized users never see the app shell.
  showLogin('Checking access…'); boot();
}
function initAuth(){
  if (!window.google || !google.accounts) { setTimeout(initAuth, 150); return }
  // auto_select:false = every sign-in requires a tap on the Google button.
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCred, auto_select: false });
  google.accounts.id.renderButton(document.getElementById('gbtn'),
    { theme:'filled_blue', size:'large', shape:'pill', width:260 });
  if (FORCE_LOGIN) {
    // Auth-testing mode: wipe anything a previous session left behind and
    // land on the sign-in screen every load. No restore path.
    try {
      sessionStorage.removeItem('towos_cred');
      sessionStorage.removeItem('towos_boot');
    } catch(e){}
    return;
  }
  var saved = null;
  try { saved = sessionStorage.getItem('towos_cred') } catch(e){}
  if (saved && jwtExpMs(saved) > Date.now() + 60000) {
    CRED = saved;
    var cachedB = null;
    try { cachedB = JSON.parse(sessionStorage.getItem('towos_boot')) } catch(e){}
    if (cachedB) { B = cachedB; hideLogin(); paint(); }
    else showLogin('Loading…');
    boot();
  }
}

// fetch with one automatic retry — Apps Script occasionally answers a
// transient HTML error page instead of JSON; a second try usually lands.
function apiFetch(url, attempt){
  return fetch(url).then(function(r){ return r.text() }).then(function(txt){
    try { return JSON.parse(txt) }
    catch(e){ throw new Error('NONJSON:' + txt.substring(0, 80)) }
  }).catch(function(e){
    if (attempt < 1) return new Promise(function(res){ setTimeout(res, 1500) })
      .then(function(){ return apiFetch(url, attempt + 1) });
    throw e;
  });
}

function api(fn, args, onOk){
  spin(true);
  apiFetch(API_URL + '?api=1&fn=' + encodeURIComponent(fn) +
        '&args=' + encodeURIComponent(JSON.stringify(args)), 0)
    .then(function(j){
      if (!j.ok) throw new Error(j.error || 'Request failed');
      spin(false); spinMsg(''); onOk(j.data);
    })
    .catch(function(e){
      if (/^NONJSON/.test(e.message)) {
        spin(false);
        toast('Server hiccup — tap again in a few seconds.');
        console.log('raw response:', e.message);
        return;
      }
      spin(false);
      if (/Not authorized/i.test(e.message)) {
        var badCred = CRED;
        try { sessionStorage.removeItem('towos_cred') } catch(x){}
        CRED = null; showLogin('Checking…');
        // Ask the server why. Healthy config + unknown account gets a
        // plain denial; the raw diagnostic only shows when something is
        // actually misconfigured (that's the only time it's useful).
        fetch(API_URL + '?api=1&fn=dashDiag&args=' +
              encodeURIComponent(JSON.stringify(['tok:' + badCred])))
          .then(function(r){ return r.json() })
          .then(function(j){
            var d = j.data || j || {};
            var msg = document.getElementById('loginMsg');
            if (d.client_id_set && d.aud_matches_config &&
                d.tokeninfo_status === 200 && d.email_allowlisted === false) {
              msg.style.textAlign = 'center';
              msg.textContent = (d.token_email || 'This account') +
                ' doesn\u2019t have access to this dashboard.';
            } else {
              msg.style.textAlign = 'left';
              msg.textContent = JSON.stringify(d, null, 1);
            }
          })
          .catch(function(){
            document.getElementById('loginMsg').textContent =
              'Sign-in rejected and diagnostic unreachable — check deployment version.';
          });
      } else { fail(e); }
    });
}

var B = null;            // boot payload
var TD = null;           // today-board payload
var SH = null;           // shifts payload (per week)
var CFG = null;          // settings payload
var wkOff = 0;           // 0 = current pay week, -1 = last, ...
var selDriver = null;    // schedule tab selection
var selShiftDriver = null;
var editDriver = null;   // roster editor target
var editDay = null;
var editShift = null;
var DAYS = ['FRI','SAT','SUN','MON','TUE','WED','THU'];
var DAYNAMES = {FRI:'Fri',SAT:'Sat',SUN:'Sun',MON:'Mon',TUE:'Tue',WED:'Wed',THU:'Thu'};

function $(id){return document.getElementById(id)}
var BUSY=false;
function spin(on){
  BUSY=!!on;
  $('spin').className = on?'spin show':'spin';
  // hard guard against double-submit: disable every sheet button in flight
  var btns=document.querySelectorAll('.sheet .btn, .knob .kbtn');
  for(var i=0;i<btns.length;i++)btns[i].disabled=!!on;
}
function spinMsg(txt){
  var el=$('spinTxt'); if(el)el.textContent=txt||'';
}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2600)}
function fail(e){spin(false);toast((e&&e.message)||String(e))}

function boot(){
  api('dashBoot', [KEYV()], function(b){
    B=b;
    if (!FORCE_LOGIN) {
      try { sessionStorage.setItem('towos_boot', JSON.stringify(b)) } catch(e){}
    }
    hideLogin(); paint();
    if(!TD) loadToday(false);
  });
}
function paint(){
  $('me').textContent = B.me + (B.t ? ' · '+B.t.verify+'+'+B.t.sheets+'ms'+(B.t.cached?' \u26a1':'') : '');
  $('tabC').style.display = B.canSettings ? '' : 'none';
  if(!selDriver){
    var firstActive=B.roster.filter(function(d){return /^active$/i.test(d.status)&&d.role==='Driver'})[0];
    selDriver=firstActive?firstActive.id:(B.roster[0]&&B.roster[0].id);
  }
  renderRoster(); renderSched();
}

function dispName(d){return d.pref||d.first||d.full}
function fmtT(t){ if(!t)return''; var p=t.split(':'),h=+p[0],m=p[1];
  var ap=h<12?'a':'p'; h=h%12||12; return h+(m!=='00'?':'+m:'')+ap }
function fmtTruck(u){return u?String(u).replace(/^truck_/,''):''}

function showTab(t){
  var tabs={today:'tabT',roster:'tabR',sched:'tabS',shifts:'tabH',settings:'tabC'};
  Object.keys(tabs).forEach(function(x){$(tabs[x]).className='tab'+(x===t?' on':'')});
  $('vToday').style.display=t==='today'?'':'none';
  $('vRoster').style.display=t==='roster'?'':'none';
  $('vSched').style.display=t==='sched'?'':'none';
  $('vShifts').style.display=t==='shifts'?'':'none';
  $('vSettings').style.display=t==='settings'?'':'none';
  if(t==='today'&&!TD)loadToday(false);
  if(t==='shifts'&&!SH)loadShifts();
  if(t==='settings'&&!CFG)loadCfg();
}

/* ============ TODAY BOARD ============ */
function loadToday(force){
  if(TD&&!force){renderToday();return}
  api('dashToday',[KEYV()],function(t){TD=t;renderToday()});
}
function renderToday(){
  $('tdLabel').textContent=TD.label+' \u00b7 as of '+TD.now;
  var v=$('todayList'); v.innerHTML='';
  if(!TD.rows.length){v.innerHTML='<div class="empty">Nothing scheduled and nobody punched. Quiet day.</div>';return}
  var groups=[
    ['ON','On the clock'],
    ['LATE','No punch \u2014 past start'],
    ['SOON','Coming up'],
    ['DONE','Done today'],
    ['EXTRA','Unscheduled punches'],
    ['OFF','Off today']
  ];
  groups.forEach(function(g){
    var rows=TD.rows.filter(function(r){return r.state===g[0]});
    if(!rows.length)return;
    var hd=document.createElement('div'); hd.className='secthead'; hd.textContent=g[1]+' ('+rows.length+')';
    v.appendChild(hd);
    rows.forEach(function(r){v.appendChild(todayCard(r))});
  });
}
function todayCard(r){
  var el=document.createElement('div'); el.className='card tcard';
  var chip='';
  if(r.state==='ON')chip='<span class="chip ok">ON'+(r.sinceYesterday?' \u00b7 overnight':'')+'</span>';
  else if(r.state==='LATE')chip='<span class="chip warn">'+fmtLate(r.lateMin)+' late</span>';
  else if(r.state==='SOON')chip='<span class="chip">at '+fmtT(r.schedStart)+'</span>';
  else if(r.state==='DONE')chip='<span class="chip">'+(r.hours?r.hours+'h':'done')+'</span>';
  else if(r.state==='EXTRA')chip='<span class="chip amber">unscheduled</span>';
  else chip='<span class="chip dim">OFF</span>';

  var sched=r.schedStart
    ? 'Sched '+fmtT(r.schedStart)+' \u2013 '+fmtT(r.schedEnd)+(r.schedOvernight?' +1d':'')
    : (r.off?'Not scheduled (off)':'Not scheduled');

  var act='';
  if(r.state==='ON'){
    act='<b>In '+fmtT(r.inT)+'</b>'+(r.sinceYesterday?' (yesterday)':'')+' \u00b7 still on';
  } else if(r.state==='DONE'){
    act='<b>'+fmtT(r.inT)+' \u2013 '+fmtT(r.outT)+'</b>'+(r.overnightDone?' (overnight)':'')+
        (r.hours?' \u00b7 '+r.hours+'h':'');
  } else if(r.state==='LATE'){
    act='<b style="color:var(--red)">No punch yet</b>';
  } else if(r.state==='SOON'){
    act='Starts '+fmtT(r.schedStart);
  } else if(r.off&&r.offReason){
    act=esc(r.offReason);
  }
  el.innerHTML='<div class="rowline"><span class="nm">'+esc(r.name)+
    (r.role&&r.role!=='Driver'?' <span style="font-weight:400;color:var(--mut);font-size:12px">'+esc(r.role)+'</span>':'')+
    '</span>'+chip+'</div>'+
    '<div class="sched">'+sched+'</div>'+
    (act?'<div class="act">'+act+'</div>':'');
  return el;
}
function fmtLate(min){
  if(min>=60){var h=Math.floor(min/60),m=min%60;return h+'h'+(m?m+'m':'')}
  return min+'m';
}

/* ============ SHIFTS ============ */
function loadShifts(){
  api('dashShifts',[wkOff,KEYV()],function(s){
    SH=s;
    if(!selShiftDriver)selShiftDriver=selDriver;
    renderShifts();
  });
}
function wkNav(d){
  if(wkOff+d>0)return;
  wkOff+=d; SH=null; loadShifts();
}
function renderShifts(){
  $('wkLabel').textContent=(wkOff===0?'This week \u00b7 ':wkOff===-1?'Last week \u00b7 ':'')+SH.label;
  $('wkFwd').disabled=(wkOff===0);
  var p=$('pickerH'); p.innerHTML='';
  var listed=B.roster.filter(function(d){return /^active$/i.test(d.status)});
  listed.forEach(function(d){
    var c=document.createElement('div');
    c.className='pchip'+(d.id===selShiftDriver?' on':'');
    var tot=SH.totals[d.id];
    c.textContent=dispName(d)+(tot?' \u00b7 '+tot+'h':'');
    c.onclick=function(){selShiftDriver=d.id;renderShifts()};
    p.appendChild(c);
  });
  var v=$('shiftList'); v.innerHTML='';
  var rows=SH.shifts.filter(function(s){return s.driverId===selShiftDriver});
  if(!rows.length){v.innerHTML='<div class="empty">No shifts recorded this week.</div>';return}
  rows.forEach(function(s){
    var el=document.createElement('div'); el.className='card shift';
    var dd=s.date.slice(5).replace('-','/');
    var dayNice=s.day.charAt(0)+s.day.slice(1).toLowerCase();
    var times=(s.inT?fmtT(s.inT):'\u2014')+' \u2013 '+(s.outT?fmtT(s.outT)+(s.outNextDay?' +1d':''):'\u2026');
    var tags='';
    if(s.status==='OPEN')tags+='<span class="tag open">OPEN</span>';
    if(s.status==='CLOSED'&&(!s.hours))tags+='<span class="tag zero">0.0h</span>';
    el.innerHTML='<div class="rowline"><span class="nm" style="font-size:15px">'+dayNice+' '+dd+tags+'</span>'+
      '<span class="hrs">'+(s.status==='CLOSED'&&s.hours?s.hours+'h':'')+'</span></div>'+
      '<div class="meta">'+times+(s.unit?' \u00b7 truck '+fmtTruck(s.unit):'')+'</div>'+
      (s.notes?'<div class="meta">'+esc(s.notes)+'</div>':'');
    el.onclick=function(){openShift(s)};
    v.appendChild(el);
  });
  var t=document.createElement('div'); t.className='secthead';
  t.textContent='Week total: '+(SH.totals[selShiftDriver]||0)+'h';
  v.appendChild(t);
}
function openShift(s){
  editShift=s;
  var d=B.roster.filter(function(x){return x.id===s.driverId})[0];
  var dayNice=s.day.charAt(0)+s.day.slice(1).toLowerCase();
  $('sTitle').textContent=(d?dispName(d):s.driverId)+' \u2014 '+dayNice+' '+s.date.slice(5).replace('-','/');
  $('sMeta').textContent=s.id+' \u00b7 '+s.status+(s.outNextDay?' \u00b7 clock-out lands next day':'');
  $('sIn').value=s.inT||''; $('sOut').value=s.outT||''; $('sReason').value='';
  $('sReopenBtn').style.display=s.status==='CLOSED'?'':'none';
  openSheet('shShift');
}
function saveShift(){
  var s=editShift, inV=$('sIn').value, outV=$('sOut').value, why=$('sReason').value.trim();
  var jobs=[];
  if(inV&&inV!==s.inT)jobs.push(['clock_in',inV]);
  if(outV&&outV!==s.outT)jobs.push(['clock_out',outV]);
  if(!jobs.length){toast('No time changes');return}
  var run=function(i){
    if(i>=jobs.length){toast('Saved');closeSheets();SH=null;TD=null;loadShifts();return}
    api('dashFixShiftTime',[s.id,jobs[i][0],jobs[i][1],why,KEYV()],function(){run(i+1)});
  };
  run(0);
}
function reopenShift(){
  var s=editShift;
  if(!confirm('Reopen this shift? Clock-out and hours will be cleared. Record only \u2014 it does not put them back on the live clock.'))return;
  api('dashReopenShift',[s.id,KEYV()],function(){toast('Reopened');closeSheets();SH=null;TD=null;loadShifts()});
}
function deleteShift(){
  var s=editShift;
  if(!confirm('DELETE this shift'+(s.hours?' ('+s.hours+'h)':'')+' on '+s.date+'? The full row is preserved in Bot_Log, but it disappears from payroll.'))return;
  api('dashDeleteShift',[s.id,KEYV()],function(){toast('Deleted');closeSheets();SH=null;TD=null;loadShifts()});
}

/* ============ SETTINGS ============ */
function loadCfg(){
  api('dashConfigList',[KEYV()],function(c){CFG=c;renderSettings()});
}
function renderSettings(){
  var v=$('cfgList'); v.innerHTML='';
  if(!CFG.knobs.length){v.innerHTML='<div class="empty">No settings found.</div>';return}
  CFG.knobs.forEach(function(kn){
    var el=document.createElement('div');
    el.className='knob'+(kn.type==='locked'?' locked':'');
    var head=document.createElement('div');
    head.innerHTML='<span class="kinfo">i</span><div class="kdesc">'+esc(kn.label)+
      (kn.type==='locked'?' \ud83d\udd12':'')+'</div><div class="kkey">'+esc(kn.key)+'</div>';
    el.appendChild(head);
    var help=document.createElement('div'); help.className='khelp';
    help.textContent=kn.help||'';
    el.appendChild(help);
    head.querySelector('.kinfo').onclick=function(ev){
      ev.stopPropagation();
      help.className='khelp'+(/show/.test(help.className)?'':' show');
    };
    var row=document.createElement('div'); row.className='krow';
    if(kn.type==='toggle'){
      var on=kn.value.trim().toLowerCase()===String(kn.valOn).toLowerCase();
      var sw=document.createElement('div'); sw.className='switch'+(on?' on':'');
      sw.onclick=function(){
        var next=on?kn.valOff:kn.valOn;
        if(!confirm('Turn '+esc(kn.label)+' '+(on?'OFF':'ON')+'? This changes live system behavior.'))return;
        api('dashSetConfig',[kn.key,next,KEYV()],function(){toast(kn.label+' '+(on?'off':'on'));CFG=null;loadCfg()});
      };
      var lbl=document.createElement('span');
      lbl.style.fontWeight='700'; lbl.style.color=on?'var(--green)':'var(--mut)';
      lbl.textContent=on?'ON':'OFF';
      row.appendChild(sw); row.appendChild(lbl);
    } else if(kn.type==='enum'){
      row.className='enumrow';
      kn.options.forEach(function(opt){
        var c=document.createElement('div');
        var cur=kn.value.trim().toUpperCase()===opt;
        c.className='echip'+(cur?' on':'');
        c.textContent=opt;
        c.onclick=function(){
          if(cur)return;
          if(!confirm('Set '+kn.label+' to '+opt+'? This changes live system behavior.'))return;
          api('dashSetConfig',[kn.key,opt,KEYV()],function(){toast(kn.label+' \u2192 '+opt);CFG=null;loadCfg()});
        };
        row.appendChild(c);
      });
    } else if(kn.type==='number'){
      var ninp=document.createElement('input'); ninp.value=kn.value;
      ninp.type='number'; ninp.inputMode='numeric';
      if(kn.min!=null)ninp.min=kn.min; if(kn.max!=null)ninp.max=kn.max;
      var nbtn=document.createElement('button'); nbtn.className='kbtn'; nbtn.textContent='Save';
      nbtn.onclick=function(){
        var nv=ninp.value.trim();
        if(nv===kn.value){toast('No change');return}
        if(!confirm('Set '+kn.label+' to '+nv+'?'))return;
        api('dashSetConfig',[kn.key,nv,KEYV()],function(){toast('Saved');CFG=null;loadCfg()});
      };
      row.appendChild(ninp); row.appendChild(nbtn);
    } else if(kn.type==='text'){
      var tinp=document.createElement('input'); tinp.value=kn.value;
      var tbtn=document.createElement('button'); tbtn.className='kbtn'; tbtn.textContent='Save';
      tbtn.onclick=function(){
        var nv=tinp.value.trim();
        if(nv===kn.value){toast('No change');return}
        if(!confirm('Change '+kn.label+'?'))return;
        api('dashSetConfig',[kn.key,nv,KEYV()],function(){toast('Saved');CFG=null;loadCfg()});
      };
      row.appendChild(tinp); row.appendChild(tbtn);
    } else {
      // locked — value on display, no control
      var lv=document.createElement('div'); lv.className='lockval';
      lv.textContent=kn.value||'(blank)';
      row.appendChild(lv);
    }
    el.appendChild(row);
    v.appendChild(el);
  });
}

/* ============ ROSTER ============ */
function renderRoster(){
  var v=$('vRoster'); v.innerHTML='';
  var act=B.roster.filter(function(d){return /^active$/i.test(d.status)});
  var inact=B.roster.filter(function(d){return !/^active$/i.test(d.status)});
  v.innerHTML+='<div class="secthead">Active ('+act.length+')</div>';
  act.forEach(function(d){v.appendChild(card(d))});
  v.innerHTML+='<div class="secthead">Inactive ('+inact.length+')</div>';
  var frag=document.createDocumentFragment();
  inact.forEach(function(d){frag.appendChild(card(d))});
  v.appendChild(frag);
  // rebind active cards (innerHTML+= killed listeners)
  var cards=v.querySelectorAll('.card');
  var all=act.concat(inact);
  cards.forEach(function(c,i){c.onclick=function(){openDriver(all[i])}});
}
function card(d){
  var el=document.createElement('div'); el.className='card';
  var missing=[];
  if(!d.role)missing.push('Role'); if(!d.tier)missing.push('Tier'); if(!d.phone)missing.push('Phone');
  el.innerHTML='<div class="rowline"><span class="nm">'+esc(dispName(d))+
    (d.pref&&d.pref!==d.first?' <span style="font-weight:400;color:var(--mut);font-size:13px">('+esc(d.full)+')</span>':'')+
    '</span>'+ (missing.length
      ? '<span class="chip warn">needs '+missing.join(', ')+'</span>'
      : '<span class="chip'+(/^active$/i.test(d.status)?' ok':' dim')+'">'+esc(d.role||'—')+'</span>')+
    '</div><div class="meta">'+esc(d.phone||'no phone')+' · tier '+esc(d.tier||'—')+'</div>';
  return el;
}
function openDriver(d){
  editDriver=d;
  $('dTitle').textContent=d.full;
  $('dPref').value=d.pref||''; $('dPhone').value=d.phone||''; $('dAlias').value='';
  fillSel('dRole',B.roles,d.role); fillSel('dTier',B.tiers,d.tier); fillSel('dStatus',B.statuses,d.status);
  openSheet('shDriver');
}
function saveDriver(){
  var p={ id:editDriver.id, pref:$('dPref').value.trim(), phone:$('dPhone').value.trim(),
    role:$('dRole').value, tier:$('dTier').value, status:$('dStatus').value };
  api('dashSaveDriver', [p, KEYV()], function(r){
    // optimistic local patch
    var d=B.roster.filter(function(x){return x.id===p.id})[0];
    if(d){d.pref=p.pref;d.phone=p.phone;d.role=p.role;d.tier=p.tier;d.status=p.status}
    toast(r.changes.length?('Saved: '+r.changes.length+' change(s)'):'No changes');
    closeSheets(); TD=null; renderRoster(); renderSched();
  });
}
function addAlias(){
  var a=$('dAlias').value.trim(); if(!a){toast('Type an alias first');return}
  api('dashAddAlias', [editDriver.id,a,KEYV()], function(){
    toast('Alias "'+a+'" added'); $('dAlias').value='';
  });
}

/* ============ SCHEDULE ============ */
function renderSched(){
  var p=$('picker'); p.innerHTML='';
  var listed=B.roster.filter(function(d){return /^active$/i.test(d.status)});
  listed.forEach(function(d){
    var c=document.createElement('div');
    c.className='pchip'+(d.id===selDriver?' on':'');
    c.textContent=dispName(d);
    c.onclick=function(){selDriver=d.id;renderSched()};
    p.appendChild(c);
  });
  var w=$('week'); w.innerHTML='';
  DAYS.forEach(function(day){
    var row=B.schedule.filter(function(s){return s.driverId===selDriver&&s.day===day})[0];
    var el=document.createElement('div'); el.className='day';
    el.innerHTML='<span class="dd">'+DAYNAMES[day]+'</span>'+
      (row?'<span class="tt">'+fmtT(row.start)+' – '+fmtT(row.end)+'</span><span class="un">'+
        (row.unit?('truck '+fmtTruck(row.unit)):'')+'</span>'
        :'<span class="tt offday">not scheduled</span><span class="un"></span>');
    el.onclick=function(){openDay(day,row)};
    w.appendChild(el);
  });
  var ex=$('excList'); ex.innerHTML='';
  var upcoming=B.exceptions.filter(function(e){return e.driverId===selDriver});
  if(!upcoming.length){ex.innerHTML='<div class="empty">Nothing filed.</div>'}
  upcoming.forEach(function(e){
    var el=document.createElement('div'); el.className='exline';
    var when=e.date.slice(5).replace('-','/');
    var what=e.type==='OFF'?'OFF':(e.type.replace('_',' ').toLowerCase()+' '+fmtT(e.start)+'–'+fmtT(e.end));
    el.innerHTML='<span style="font-size:14px"><b>'+esc(shortName(e.driverId,e.driver))+'</b> · '+when+' · '+what+
      (e.reason?'<div class="meta">'+esc(e.reason)+'</div>':'')+'</span><span class="x">✕</span>';
    el.querySelector('.x').onclick=function(){
      if(confirm('Remove: '+e.driver+' '+what+' on '+when+'?')){
        api('dashCancelException', [e.id,KEYV()], function(){toast('Removed');TD=null;boot()});
      }
    };
    ex.appendChild(el);
  });
}
function shortName(id,fallback){
  var d=B.roster.filter(function(x){return x.id===id})[0];
  return d?dispName(d):fallback;
}
function openDay(day,row){
  editDay=day;
  var d=B.roster.filter(function(x){return x.id===selDriver})[0];
  $('dayTitle').textContent=dispName(d)+' \u2014 schedule';
  $('dayStart').value=row?row.start:'07:00';
  $('dayEnd').value=row?row.end:'19:00';
  var us=$('dayUnit'); us.innerHTML='<option value="">\u2014 none \u2014</option>';
  B.units.forEach(function(u){
    var o=document.createElement('option'); o.value=u; o.textContent='truck '+fmtTruck(u);
    if(row&&row.unit===u)o.selected=true; us.appendChild(o);
  });
  // multi-day chips — tapped day preselected, tap others to batch
  var dc=$('dayChips'); dc.innerHTML='';
  DAYS.forEach(function(dd){
    var c=document.createElement('div');
    c.className='pchip'+(dd===day?' on':'');
    c.textContent=DAYNAMES[dd];
    c.dataset.day=dd;
    c.onclick=function(){c.className='pchip'+(/ on/.test(c.className)?'':' on')};
    dc.appendChild(c);
  });
  openSheet('shDay');
}
function saveDay(){
  var s=$('dayStart').value,e=$('dayEnd').value;
  if(!s||!e){toast('Need start and end');return}
  var days=[].slice.call($('dayChips').querySelectorAll('.pchip.on'))
    .map(function(c){return c.dataset.day});
  if(!days.length){toast('Pick at least one day');return}
  var unit=$('dayUnit').value;
  api('dashSetScheduleWeek', [selDriver,days,s,e,unit,KEYV()], function(r){
    // optimistic local patch — no full reboot
    days.forEach(function(dd){
      B.schedule=B.schedule.filter(function(x){return !(x.driverId===selDriver&&x.day===dd)});
      B.schedule.push({id:'',driverId:selDriver,day:dd,start:s,end:e,unit:unit});
    });
    toast('Saved '+r.filed+' day(s)'); closeSheets(); TD=null; renderSched();
  });
}
function clearDay(){
  var d=B.roster.filter(function(x){return x.id===selDriver})[0];
  var days=[].slice.call($('dayChips').querySelectorAll('.pchip.on'))
    .map(function(c){return c.dataset.day});
  if(!days.length)days=[editDay];
  if(!confirm('Clear '+days.map(function(x){return DAYNAMES[x]}).join(', ')+' for '+dispName(d)+'? Not scheduled those days going forward.'))return;
  var run=function(i){
    if(i>=days.length){
      days.forEach(function(dd){
        B.schedule=B.schedule.filter(function(x){return !(x.driverId===selDriver&&x.day===dd)});
      });
      toast('Cleared'); closeSheets(); TD=null; renderSched(); return;
    }
    api('dashClearScheduleDay',[selDriver,days[i],KEYV()],function(){run(i+1)});
  };
  run(0);
}
function openExc(){
  var ds=$('excDriver'); ds.innerHTML='';
  B.roster.filter(function(d){return /^active$/i.test(d.status)}).forEach(function(d){
    var o=document.createElement('option'); o.value=d.id; o.textContent=dispName(d);
    if(d.id===selDriver)o.selected=true; ds.appendChild(o);
  });
  $('excFrom').value=B.today; $('excTo').value=B.today;
  $('excType').value='OFF'; excTypeChange(); $('excReason').value='';
  openSheet('shExc');
}
function excTypeChange(){
  $('excTimes').style.display=$('excType').value==='OFF'?'none':'flex';
}
function fileExc(){
  if(BUSY)return;                       // one-shot guard
  var t=$('excType').value, f=$('excFrom').value, to=$('excTo').value||f;
  if(!f){toast('Need a from date');return}
  if(t!=='OFF'&&(!$('excStart').value||!$('excEnd').value)){toast('Need start and end times');return}
  var nDays=Math.round((new Date(to)-new Date(f))/86400000)+1;
  spinMsg(nDays>1?('Filing '+nDays+' days\u2026'):'Filing\u2026');
  api('dashAddException',
    [$('excDriver').value,f,to,t,$('excStart').value,$('excEnd').value,$('excReason').value.trim(),KEYV()],
    function(r){
      var msg=[];
      if(r.filed)msg.push('Filed '+r.filed+' day(s)');
      if(r.replaced)msg.push(r.replaced+' replaced');
      if(r.skipped)msg.push(r.skipped+' already filed');
      toast(msg.join(' \u00b7 ')||'Nothing to change');
      closeSheets(); SH=null; TD=null; boot();
    });
}

/* ============ util ============ */
function fillSel(id,opts,cur){
  var s=$(id); s.innerHTML='';
  if(!cur){var o=document.createElement('option');o.value='';o.textContent='— pick —';s.appendChild(o)}
  opts.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;
    if(v===cur)o.selected=true;s.appendChild(o)});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function openSheet(id){$('ov').className='ov show';$(id).className='sheet show'}
function closeSheets(){$('ov').className='ov';
  ['shDriver','shDay','shExc','shShift'].forEach(function(i){$(i).className='sheet'})}

initAuth();
</script>
