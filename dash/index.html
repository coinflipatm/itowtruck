<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>iTow · TowOS</title>
<link rel="icon" type="image/png" href="/assets/logos/itow-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@font-face{
  font-family:'SF Sports Night';
  src:url('/font.ttf') format('truetype');
  font-weight:normal;font-style:normal;font-display:swap;
}
/* ============================================================
   iTow TowOS — dashboard theme.
   Brand language from itowtruck.com: near-black ground, Barlow
   body, SF Sports Night display face, uppercase wide-tracked
   labels, hairline borders, flat white primary action.
   DELIBERATELY NOT from the marketing site: its low-contrast
   grey-on-black. This is read one-handed at 6am in a truck yard,
   sometimes in direct sun. Body text is near-white, secondary
   text still clears 8:1, and every tap target is >=44px.
   ============================================================ */
:root{
  --bg:#0a0a0a; --surface:#121212; --surface2:#181818; --raised:#1e1e1e;
  --line:#262626; --line2:#3a3a3a;
  --ink:#f2f2f2; --ink2:#a8a8a8; --ink3:#7c7c7c;
  --white:#fff;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c; --info:#5aa9ff; --purple:#c09cff;
  --okbg:rgba(61,220,132,.12); --warnbg:rgba(255,176,32,.12);
  --badbg:rgba(255,92,92,.12); --infobg:rgba(90,169,255,.12);
  --purplebg:rgba(192,156,255,.13);
  --brand:'SF Sports Night','Barlow Condensed',var(--body); --body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--body);background:var(--bg);color:var(--ink);
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(52px + var(--safe-b));overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- type helpers ---------- */
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.dsp{font-family:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;background:rgba(10,10,10,.94);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;gap:12px}
.hbar h1{font-family:var(--brand);font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--white);line-height:1}
.who{font-size:11px;color:var(--ink3);text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 0;min-width:0;text-align:center;padding:11px 4px 10px;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer;
  white-space:nowrap;transition:color .12s,border-color .12s;
}
.tab.on{color:var(--white);border-bottom-color:var(--white)}
.tab .dot{display:inline-block;min-width:16px;padding:0 3px;height:16px;line-height:16px;
  border-radius:8px;background:var(--raised);color:var(--ink2);font-size:9.5px;margin-left:3px;
  font-weight:700;letter-spacing:0;vertical-align:1px}
.tab.on .dot{background:var(--white);color:#000}

main{max-width:680px;margin:0 auto;padding:14px 12px 24px}

/* ---------- segmented control ---------- */
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:2px;overflow:hidden;margin-bottom:14px}
.seg button{
  flex:1;padding:12px 8px;background:transparent;border:0;cursor:pointer;
  font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
}
.seg button.on{background:var(--white);color:#000}

/* ---------- section head ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px;gap:10px}
.sec:first-child{margin-top:4px}
.sec .n{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:13px 14px;margin-bottom:8px;cursor:pointer;position:relative;
  transition:background .1s;
}
.card:active{background:var(--surface2)}
.card.flat{cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink2);margin-top:3px}
.sub2{font-size:12px;color:var(--ink3);margin-top:2px}

/* ---------- pills ---------- */
.pill{
  display:inline-block;padding:3px 9px;border-radius:2px;font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  background:var(--raised);color:var(--ink2);
}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.info{background:var(--infobg);color:var(--info)}
.pill.purple{background:var(--purplebg);color:var(--purple)}
.pill.dim{background:transparent;color:var(--ink3);border:1px solid var(--line2)}

/* ---------- today board ---------- */
.tcard{border-left:3px solid var(--line2)}
.tcard.st-ON{border-left-color:var(--ok)}
.tcard.st-LATE{border-left-color:var(--bad)}
.tcard.st-MISSED{border-left-color:var(--bad);opacity:.9}
.tcard.st-CALLIN{border-left-color:var(--purple)}
.tcard.st-NOREC{border-left-color:var(--warn)}
.tcard.st-SOON{border-left-color:var(--info)}
.tcard.st-DONE{border-left-color:var(--line2)}
.tcard.st-EXTRA{border-left-color:var(--warn)}
.tcard.st-OFF{border-left-color:var(--line);opacity:.6}
.daynav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.daynav .lab{flex:1;min-width:0;text-align:center;font-family:var(--brand);font-size:14px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--white);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{
  width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line2);background:var(--surface);
  border-radius:2px;color:var(--ink);font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
}
.ibtn:active{background:var(--surface2)}
.ibtn:disabled{opacity:.3}
.ibtn.wide{width:auto;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

/* ---------- search + filters ---------- */
.search{position:relative;margin-bottom:10px}
.search input[type=text]{
  /* specificity must beat the generic input[type=text] rule further down,
     which otherwise reset padding-left and slid the text under the icon */
  width:100%;padding:13px 14px 13px 44px;background:var(--surface);
  border:1px solid var(--line2);border-radius:2px;font-size:16px;color:var(--ink);
}
.search input::placeholder{color:var(--ink3)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 14px;border:1px solid var(--line2);background:transparent;
  border-radius:2px;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--white);border-color:var(--white);color:#000}

/* ---------- doc dots ---------- */
.docs{display:flex;gap:5px;align-items:center;margin-top:7px}
.dd{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid var(--line2);color:var(--ink3)}
.dd.has{border-color:transparent;background:var(--okbg);color:var(--ok)}

/* ---------- applicant detail ---------- */
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin:4px 0 6px}
.docbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:66px;padding:10px 6px;border:1px solid var(--line2);border-radius:2px;
  background:var(--surface);color:var(--ink);font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;text-align:center;cursor:pointer;
}
.docbtn:active{background:var(--surface2)}
.docbtn.none{opacity:.32;cursor:default;border-style:dashed}
.docbtn .ic{line-height:0;display:block}
.docbtn .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.actgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);flex:0 0 auto}
.kv .v{font-size:14px;color:var(--ink);text-align:right;word-break:break-word}
.kv .v.muted{color:var(--ink3)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:9px}
.block > .lbl{margin-bottom:8px;display:block}
.note{border-left:2px solid var(--line2);padding:7px 0 7px 11px;margin-bottom:8px}
.note .meta{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-bottom:2px}
.note .txt{font-size:13.5px;color:var(--ink2);line-height:1.45}
.emp{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
.emp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.warnbox{background:var(--warnbg);border:1px solid rgba(255,176,32,.3);border-radius:2px;
  padding:10px 12px;font-size:12.5px;color:var(--warn);line-height:1.45;margin-bottom:9px}
.badbox{background:var(--badbg);border:1px solid rgba(255,92,92,.32);border-radius:2px;
  padding:10px 12px;font-size:13px;color:#ffb3b3;line-height:1.5;margin-bottom:9px}
.badbox b{color:var(--bad);display:block;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;margin-bottom:3px}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;min-height:52px;padding:15px;border:0;border-radius:2px;
  background:var(--white);color:#000;font-size:13px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;cursor:pointer;margin-top:8px;
}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,92,92,.45)}
.btn.sm{min-height:44px;padding:11px;font-size:11px;margin-top:6px}

/* ---------- week grid / schedule ---------- */
.day{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;padding:13px 14px;margin-bottom:6px;cursor:pointer;min-height:50px}
.day:active{background:var(--surface2)}
.day .dd2{font-family:var(--brand);font-size:13px;letter-spacing:.08em;width:38px;color:var(--white)}
.day .tt{flex:1;font-size:14px;color:var(--ink)}
.day .tt.off{color:var(--ink3)}
.day .un{font-size:11px;color:var(--ink3);letter-spacing:.05em}
.exline{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 14px;margin-bottom:6px}
.exline .x{color:var(--bad);font-size:20px;padding:4px 10px;cursor:pointer;line-height:1}

/* ---------- settings ---------- */
.knob{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:13px 14px;margin-bottom:8px}
.knob.locked{opacity:.62}
.knob .kd{font-size:14px;font-weight:600;color:var(--ink);padding-right:30px}
.knob .kk{font-size:10.5px;color:var(--ink3);margin:3px 0 10px;font-family:ui-monospace,SFMono-Regular,monospace}
.knob .info{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line2);background:transparent;color:var(--ink3);font-size:12px;cursor:pointer}
.knob{position:relative}
.help{display:none;font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:2px;
  padding:10px 11px;margin-bottom:10px;line-height:1.5}
.help.on{display:block}
.krow{display:flex;gap:8px;align-items:center}
.krow input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--line2);border-radius:2px;
  font-size:16px;color:var(--ink)}
.kbtn{flex:0 0 auto;min-height:46px;padding:12px 18px;border:0;border-radius:2px;background:var(--white);
  color:#000;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sw{width:56px;height:32px;border-radius:2px;background:var(--raised);position:relative;cursor:pointer;
  flex:0 0 auto;transition:background .15s;border:1px solid var(--line2)}
.sw.on{background:var(--okbg);border-color:var(--ok)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:1px;
  background:var(--ink3);transition:left .15s,background .15s}
.sw.on::after{left:27px;background:var(--ok)}
.enum{display:flex;gap:6px}
.echip{flex:1;text-align:center;min-height:44px;padding:12px 0;border:1px solid var(--line2);
  background:transparent;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);cursor:pointer}
.echip.on{background:var(--white);border-color:var(--white);color:#000}
.lockval{font-size:13px;color:var(--ink2);word-break:break-all}

/* ---------- sheet / modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;backdrop-filter:blur(2px)}
.ov.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;
  background:var(--bg);border-top:1px solid var(--line2);border-radius:0;
  padding:18px 16px calc(26px + var(--safe-b));max-height:90vh;overflow-y:auto;
  max-width:680px;margin:0 auto;
}
.sheet.on{display:block;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--brand);font-size:19px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--white);margin-bottom:4px;padding-right:40px}
.sheet .shsub{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.sheet .close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);border-radius:2px;font-size:16px;cursor:pointer;line-height:1}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:14px 0 5px}
input[type=text],input[type=tel],input[type=time],input[type=date],select,textarea{
  width:100%;padding:13px 12px;font-size:16px;background:var(--surface);
  border:1px solid var(--line2);border-radius:2px;color:var(--ink);
}
textarea{resize:vertical;min-height:76px;line-height:1.45}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.two{display:flex;gap:9px}.two>div{flex:1}

/* ---------- toast / spinner / empty ---------- */
.toast{position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);
  background:var(--white);color:#000;padding:12px 20px;border-radius:2px;font-size:13.5px;
  font-weight:600;z-index:99;display:none;max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.bad{background:var(--bad);color:#fff}
.spin{position:fixed;inset:0;z-index:98;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(10,10,10,.55);backdrop-filter:blur(1px)}
.spin.on{display:flex}
.spin .ring{width:32px;height:32px;border:2px solid var(--line2);border-top-color:var(--white);
  border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin .txt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.empty{color:var(--ink3);font-size:13.5px;text-align:center;padding:34px 16px;line-height:1.6}

/* ---------- footer ---------- */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,10,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  font-size:10px;color:var(--ink3);text-align:center;padding:8px 10px calc(8px + var(--safe-b));
  letter-spacing:.06em}
#foot b{color:var(--ink2);font-weight:700}
#foot .stale{color:var(--warn)}
#foot a{color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line2)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:320px;text-align:center}
#login h2{font-family:var(--brand);font-size:30px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--white);margin-bottom:6px}
#login p{font-size:12.5px;color:var(--ink3);margin-bottom:26px;letter-spacing:.05em}
#gbtn{display:flex;justify-content:center;min-height:44px}
#loginMsg{font-size:12.5px;color:var(--bad);margin-top:16px;min-height:18px;line-height:1.5;word-break:break-word}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <h1>iTow · TowOS</h1>
    <div class="who" id="me"></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="tabToday"  onclick="showTab('today')">Today</div>
    <div class="tab"    id="tabPeople" onclick="showTab('people')">People<span class="dot" id="applDot" style="display:none">0</span></div>
    <div class="tab"    id="tabSched"  onclick="showTab('sched')">Schedule</div>
    <div class="tab"    id="tabShifts" onclick="showTab('shifts')">Shifts</div>
    <div class="tab"    id="tabCfg"    onclick="showTab('settings')" style="display:none">Settings</div>
  </div>
</header>

<main>

  <!-- ========== TODAY ========== -->
  <section id="vToday">
    <div class="daynav">
      <button class="ibtn" onclick="dayNav(-1)" aria-label="Previous day">&#8249;</button>
      <div class="lab" id="dayLabel" onclick="dayPick()">&nbsp;</div>
      <button class="ibtn" onclick="dayNav(1)" aria-label="Next day">&#8250;</button>
      <button class="ibtn wide" id="dayToday" onclick="dayReset()" style="display:none">Today</button>
      <button class="ibtn" onclick="dayRefresh()" aria-label="Refresh">&#8635;</button>
      <input type="date" id="dayInput" onchange="daySet(this.value)"
             style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
    </div>
    <div id="todayList"><div class="empty">Loading&hellip;</div></div>
  </section>

  <!-- ========== PEOPLE ========== -->
  <section id="vPeople" style="display:none">
    <div class="seg">
      <button id="segCrew" class="on" onclick="peopleTab('crew')">Crew</button>
      <button id="segAppl" onclick="peopleTab('appl')">Applicants</button>
    </div>
    <div id="pCrew"></div>
    <div id="pAppl" style="display:none">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
        </svg>
        <input id="aSearch" type="text" inputmode="search" placeholder="Search name or phone"
               oninput="renderAppl()" autocomplete="off">
      </div>
      <div class="chips wrap" id="aChips"></div>
      <div id="aList"><div class="empty">Loading&hellip;</div></div>
    </div>
  </section>

  <!-- ========== SCHEDULE ========== -->
  <section id="vSched" style="display:none">
    <div class="chips" id="picker"></div>
    <div class="sec"><span class="lbl">Standing week · Fri–Thu</span></div>
    <div id="week"></div>
    <button class="btn sec" onclick="openExc()">+ Time off / exception</button>
    <div class="sec"><span class="lbl">Upcoming exceptions</span></div>
    <div id="excList"></div>
  </section>

  <!-- ========== SHIFTS ========== -->
  <section id="vShifts" style="display:none">
    <div class="daynav">
      <button class="ibtn" onclick="wkNav(-1)">&#8249;</button>
      <div class="lab" id="wkLabel">&nbsp;</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
var API_URL   = "https://script.google.com/macros/s/AKfycbxB9ymqvQWNa86CM0AkSRHRsb0XZ14bHKS98wCw6pCEwDeUmvEPIVAdIvlPeuC39kizkQ/exec";
var CLIENT_ID = "467184176739-4houlseq386a35ufvc4ed8p96q92pmug.apps.googleusercontent.com";
var FORCE_LOGIN = false;
var FE_VERSION  = '4.1';      // expects server v3.12+ (applicant endpoints)

/* ==========================================================
   AUTH
   ========================================================== */
var CRED = null;
function KEYV(){ return 'tok:' + CRED }
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function jwtExpMs(t){ try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000 }catch(e){ return 0 } }
function showLogin(m){ $('login').style.display='flex'; if(m)$('loginMsg').textContent=m }
function hideLogin(){ $('login').style.display='none' }

function onCred(r){
  CRED = r.credential;
  if(!FORCE_LOGIN){ try{ sessionStorage.setItem('towos_cred', CRED) }catch(e){} }
  showLogin('Checking access…'); loadInit(false,false);
}
function initAuth(){
  if(!window.google || !google.accounts){ setTimeout(initAuth,150); return }
  google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onCred, auto_select:false });
  google.accounts.id.renderButton($('gbtn'), { theme:'filled_black', size:'large', shape:'rectangular', width:280 });
  if(FORCE_LOGIN){ try{ sessionStorage.removeItem('towos_cred'); sessionStorage.removeItem('towos_init') }catch(e){} return }
  var saved=null; try{ saved=sessionStorage.getItem('towos_cred') }catch(e){}
  if(saved && jwtExpMs(saved) > Date.now()+60000){
    CRED = saved;
    var cached=null; try{ cached=JSON.parse(sessionStorage.getItem('towos_init')) }catch(e){}
    if(cached && cached.d){
      B=cached.d.boot; TD=cached.d.today; HEALTH=cached.d.health;
      hideLogin(); paint(); renderBoard(TD,false); renderFoot(true);
      loadInit(false,true);
    } else { showLogin('Loading…'); loadInit(false,false); }
  }
}
function logout(){
  CRED=null;B=null;TD=null;HEALTH=null;APPL=null;SH=null;CFG=null;lastInitAt=0;
  try{ sessionStorage.removeItem('towos_cred'); sessionStorage.removeItem('towos_init') }catch(e){}
  try{ if(window.google&&google.accounts) google.accounts.id.disableAutoSelect() }catch(e){}
  $('foot').innerHTML=''; $('loginMsg').textContent=''; showLogin('Signed out.');
}

/* ==========================================================
   API — single spinner, one retry on Apps Script's occasional
   HTML error page. BUSY guards every sheet button.
   ========================================================== */
var BUSY=false;
function spin(on,msg){
  BUSY=!!on;
  $('spin').className = on?'spin on':'spin';
  $('spinTxt').textContent = msg||'';
  var b=document.querySelectorAll('.sheet .btn, .knob .kbtn');
  for(var i=0;i<b.length;i++) b[i].disabled=!!on;
}
function toast(m,bad){
  var t=$('toast'); t.textContent=m; t.className=bad?'toast bad':'toast';
  t.style.display='block'; clearTimeout(t._h);
  t._h=setTimeout(function(){ t.style.display='none' },3000);
}
/* Only reads may be retried. Every other endpoint writes, and Apps Script can
   finish the write and still fail to return parseable JSON — so a blind retry
   runs the write a second time. That is how one internal note got appended
   twice on 2026-09-03. Names not in this map are treated as writes on purpose:
   the fail-safe direction is "don't repeat it". */
var READ_FNS = { dashInit:1, dashDay:1, dashApplicants:1, dashApplicant:1,
                 dashShifts:1, dashConfigList:1, dashDiag:1 };

function apiFetch(url,attempt,retryOk){
  return fetch(url).then(function(r){ return r.text() }).then(function(txt){
    try{ return JSON.parse(txt) }catch(e){ throw new Error('NONJSON:'+txt.substring(0,80)) }
  }).catch(function(e){
    if(retryOk && attempt<1) return new Promise(function(res){ setTimeout(res,1500) })
      .then(function(){ return apiFetch(url,attempt+1,retryOk) });
    throw e;
  });
}

/* PENDING ref-counts in-flight requests so a response arriving while another
   is still running cannot clear the spinner or re-enable the buttons under it.
   INFLIGHT drops an identical write fired twice before the first has answered. */
var PENDING = 0, INFLIGHT = {};

function api(fn,args,ok,quiet,msg){
  var isRead = !!READ_FNS[fn];
  var sig = fn+'|'+JSON.stringify(args);
  if(!isRead){
    if(INFLIGHT[sig]){ toast('Already saving that — hang on.',true); return }
    INFLIGHT[sig]=1;
  }
  if(!quiet){ PENDING++; spin(true,msg) }
  function settle(){
    if(!isRead) delete INFLIGHT[sig];
    if(!quiet){ PENDING = Math.max(0,PENDING-1); if(!PENDING) spin(false) }
  }
  apiFetch(API_URL+'?api=1&fn='+encodeURIComponent(fn)+'&args='+encodeURIComponent(JSON.stringify(args)),0,isRead)
    .then(function(j){
      if(!j.ok) throw new Error(j.error||'Request failed');
      settle(); ok(j.data);
    })
    .catch(function(e){
      settle();
      if(/^NONJSON/.test(e.message)){
        toast(isRead ? 'Server hiccup — tap again in a few seconds.'
                     : 'No answer from the server. It may have saved anyway — check before retrying.', true);
        return;
      }
      if(/Not authorized/i.test(e.message)){ authFail(); return }
      toast(e.message||String(e), true);
    });
}
function authFail(){
  var bad=CRED;
  try{ sessionStorage.removeItem('towos_cred') }catch(e){}
  CRED=null; showLogin('Checking…');
  fetch(API_URL+'?api=1&fn=dashDiag&args='+encodeURIComponent(JSON.stringify(['tok:'+bad])))
    .then(function(r){ return r.json() }).then(function(j){
      var d=j.data||j||{}, m=$('loginMsg');
      if(d.client_id_set && d.aud_matches_config && d.tokeninfo_status===200 && d.email_allowlisted===false){
        m.textContent=(d.token_email||'That account')+' doesn’t have access to this dashboard.';
      } else { m.textContent=JSON.stringify(d,null,1) }
    })
    .catch(function(){ $('loginMsg').textContent='Sign-in rejected and the diagnostic is unreachable — check the deployment version.' });
}

/* ==========================================================
   STATE
   ========================================================== */
var B=null, TD=null, HEALTH=null, SH=null, CFG=null, APPL=null, APDET=null;
var lastInitAt=0, wkOff=0, daySel=null, viewOnly=false;
var selDriver=null, selShiftDriver=null, editDriver=null, editDay=null, editShift=null;
var peopleView='crew', aFilter='ALL', stageTarget=null, noteTarget=null;
var DAYS=['FRI','SAT','SUN','MON','TUE','WED','THU'];
var DAYNAMES={FRI:'Fri',SAT:'Sat',SUN:'Sun',MON:'Mon',TUE:'Tue',WED:'Wed',THU:'Thu'};
var STAGES=['New','Reviewing','Contacted','Interviewed','Rejected'];

/* ==========================================================
   SHEETS + CONFIRM (no native confirm/prompt anywhere)
   ========================================================== */
var SHEET_IDS=['shAppl','shNote','shStage','shDriver','shDay','shExc','shAct','shShift','shConfirm'];
function openSheet(id){ $('ov').className='ov on'; $(id).className='sheet on' }
function closeSheets(){
  $('ov').className='ov';
  SHEET_IDS.forEach(function(i){ $(i).className='sheet' });
}
/* confirm({title, body, okText, danger, input:{label,placeholder,required}}, cb) */
function confirmSheet(o,cb){
  $('cfTitle').textContent=o.title||'Are you sure?';
  $('cfBody').textContent=o.body||'';
  var wrap=$('cfInputWrap'), inp=$('cfInput');
  if(o.input){
    wrap.style.display=''; $('cfInputLbl').textContent=o.input.label||'Reason';
    inp.value=''; inp.placeholder=o.input.placeholder||'';
  } else { wrap.style.display='none'; inp.value='' }
  var btn=$('cfOk');
  btn.textContent=o.okText||'Confirm';
  btn.className='btn'+(o.danger?' danger':'');
  btn.onclick=function(){
    var v=inp.value.trim();
    if(o.input && o.input.required && !v){ toast('That needs a reason first.',true); return }
    closeSheets(); cb(v);
  };
  openSheet('shConfirm');
}

/* ==========================================================
   BOOT
   ========================================================== */
function loadInit(force,quiet){
  api('dashInit',[KEYV(), force?1:0], function(d){
    B=d.boot; TD=d.today; HEALTH=d.health; lastInitAt=Date.now();
    if(!FORCE_LOGIN){ try{ sessionStorage.setItem('towos_init', JSON.stringify({t:lastInitAt,d:d})) }catch(e){} }
    hideLogin(); paint();
    if(!daySel) renderBoard(TD,false);
    renderFoot(false);
  }, quiet, 'Loading');
}
function paint(){
  $('me').textContent = B.me || '';
  $('tabCfg').style.display = B.canSettings ? '' : 'none';
  if(!selDriver){
    var f=B.roster.filter(function(d){ return /^active$/i.test(d.status) && d.role==='Driver' })[0];
    selDriver = f ? f.id : (B.roster[0]&&B.roster[0].id);
  }
  renderCrew(); renderSched();
  if(APPL===null) loadAppl(true);
}
function renderFoot(stale){
  var f=$('foot'); if(!f||!HEALTH) return;
  f.innerHTML='<b>srv '+esc(HEALTH.version)+' · fe '+FE_VERSION+'</b> · '+
    (stale?'<span class="stale">as of '+esc(HEALTH.generatedAt)+' · refreshing…</span>'
          :'as of '+esc(HEALTH.generatedAt))+
    (HEALTH.cached?' ⚡':'')+
    (/^fallback/.test(HEALTH.mode||'')?' · <span class="stale">slow mode</span>':'')+
    ' · <a href="#" onclick="logout();return false">Sign out</a>';
}
function showTab(t){
  var map={today:'tabToday',people:'tabPeople',sched:'tabSched',shifts:'tabShifts',settings:'tabCfg'};
  Object.keys(map).forEach(function(x){
    $(map[x]).className = 'tab'+(x===t?' on':'');
    if(x===t && $(map[x]).querySelector('.dot')) {}
  });
  $('vToday').style.display    = t==='today'?'':'none';
  $('vPeople').style.display   = t==='people'?'':'none';
  $('vSched').style.display    = t==='sched'?'':'none';
  $('vShifts').style.display   = t==='shifts'?'':'none';
  $('vSettings').style.display = t==='settings'?'':'none';
  if(t==='shifts'   && !SH)  loadShifts();
  if(t==='settings' && !CFG) loadCfg();
  if(t==='people'   && APPL===null) loadAppl(false);
  window.scrollTo(0,0);
}

/* ==========================================================
   TODAY / ANY-DAY BOARD
   ========================================================== */
function fmtT(t){ if(!t) return ''; var p=String(t).split(':'),h=+p[0],m=p[1];
  var ap=h<12?'a':'p'; h=h%12||12; return h+(m!=='00'?':'+m:'')+ap }
function fmtTruck(u){ return u?String(u).replace(/^truck_/,''):'' }
function fmtLate(min){ if(min>=60){var h=Math.floor(min/60),m=min%60;return h+'h'+(m?m+'m':'')} return min+'m' }
function ymdShift(ymd,d){
  var p=ymd.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]); dt.setDate(dt.getDate()+d);
  var m=dt.getMonth()+1, day=dt.getDate();
  return dt.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function dayRefresh(){ daySel?loadDay(daySel):loadInit(true,false) }
function dayReset(){ daySel=null; $('dayToday').style.display='none'; loadInit(true,false) }
function dayNav(d){ var base=daySel||B.today; daySel=ymdShift(base,d);
  if(daySel===B.today){ dayReset(); return } loadDay(daySel) }
function dayPick(){ var i=$('dayInput'); i.value=daySel||B.today; (i.showPicker?i.showPicker():i.click()) }
function daySet(v){ if(!v) return; if(v===B.today){ dayReset(); return } daySel=v; loadDay(v) }
function loadDay(ymd){
  api('dashDay',[ymd,KEYV()],function(t){
    if(t.isToday){ TD=t; daySel=null; $('dayToday').style.display='none'; renderBoard(t,false); return }
    $('dayToday').style.display=''; renderBoard(t,true);
  }, false, 'Loading day');
}
var BOARD=null;
function renderBoard(T,ro){
  if(!T) return;
  BOARD=T; viewOnly=!!ro;
  $('dayLabel').textContent = T.label+' · '+(ro?(T.isPast?'final':'planned'):('as of '+T.now));
  var v=$('todayList'); v.innerHTML='';
  if(!T.rows.length){
    v.innerHTML='<div class="empty">'+(ro?'Nothing on this day.':'Nothing scheduled and nobody punched.<br>Quiet day.')+'</div>';
    return;
  }
  var groups=[
    ['ON','On the clock'],['LATE','No punch — past start'],['MISSED','No-shows'],
    ['CALLIN','Call-ins'],['NOREC','Scheduled — no punch recorded'],['SOON','Coming up'],
    ['DONE','Done'],['EXTRA','Unscheduled punches'],['OFF','Off']
  ];
  groups.forEach(function(g){
    var rows=T.rows.filter(function(r){ return r.state===g[0] });
    if(!rows.length) return;
    var h=document.createElement('div'); h.className='sec';
    h.innerHTML='<span class="lbl">'+g[1]+'</span><span class="n">'+rows.length+'</span>';
    v.appendChild(h);
    rows.forEach(function(r){ v.appendChild(boardCard(r)) });
  });
}
function boardCard(r){
  var el=document.createElement('div');
  el.className='card tcard st-'+r.state;
  if(viewOnly) el.style.pointerEvents='none';
  el.onclick=function(){ openAct(r) };
  var pill='';
  if(r.state==='ON')          pill='<span class="pill ok">On'+(r.sinceYesterday?' · overnight':'')+'</span>';
  else if(r.state==='LATE')   pill='<span class="pill bad">'+fmtLate(r.lateMin)+' late</span>';
  else if(r.state==='SOON')   pill='<span class="pill info">'+fmtT(r.schedStart)+'</span>';
  else if(r.state==='DONE')   pill='<span class="pill">'+(r.hours?r.hours+'h':'done')+'</span>';
  else if(r.state==='EXTRA')  pill='<span class="pill warn">unscheduled</span>';
  else if(r.state==='MISSED') pill='<span class="pill bad">no-show</span>';
  else if(r.state==='CALLIN') pill='<span class="pill purple">called in</span>';
  else if(r.state==='NOREC')  pill='<span class="pill warn">no record</span>';
  else                        pill='<span class="pill dim">Off</span>';

  var sched = r.schedStart
    ? fmtT(r.schedStart)+' – '+fmtT(r.schedEnd)+(r.schedOvernight?' +1d':'')
    : (r.off?'Not scheduled · off':'Not scheduled');
  var act='';
  if(r.state==='ON')          act='In <b>'+fmtT(r.inT)+'</b>'+(r.sinceYesterday?' yesterday':'')+' · still on';
  else if(r.state==='DONE')   act='<b>'+fmtT(r.inT)+' – '+fmtT(r.outT)+'</b>'+(r.overnightDone?' overnight':'')+(r.hours?' · '+r.hours+'h':'');
  else if(r.state==='LATE')   act='<span style="color:var(--bad)">No punch yet</span>';
  else if(r.state==='MISSED') act='<span style="color:var(--bad)">Marked missed</span> · 0h';
  else if(r.state==='CALLIN') act='<span style="color:var(--purple)">Called in</span>'+(r.offReason?' · '+esc(r.offReason):'');
  else if(r.state==='NOREC')  act='<span style="color:var(--warn)">Scheduled, no punch, no mark</span>';
  else if(r.state==='SOON')   act='Starts '+fmtT(r.schedStart);
  else if(r.off&&r.offReason) act=esc(r.offReason);

  el.innerHTML=
    '<div class="row"><span class="nm">'+esc(r.name)+
      (r.role&&r.role!=='Driver'?' <span style="font-weight:400;color:var(--ink3);font-size:12px">'+esc(r.role)+'</span>':'')+
    '</span>'+pill+'</div>'+
    '<div class="sub2">'+sched+'</div>'+
    (act?'<div class="sub">'+act+'</div>':'');
  return el;
}
var taRow=null;
function openAct(r){
  taRow=r;
  $('taName').textContent=r.name;
  var m=[];
  if(r.schedStart) m.push('Sched '+fmtT(r.schedStart)+'–'+fmtT(r.schedEnd)+(r.schedOvernight?' +1d':''));
  if(r.inT) m.push('In '+fmtT(r.inT)+(r.sinceYesterday?' (yest)':''));
  if(r.outT) m.push('Out '+fmtT(r.outT));
  if(r.state==='CALLIN') m.push('Called in'+(r.offReason?': '+r.offReason:''));
  else if(r.off) m.push('Off'+(r.offReason?': '+r.offReason:''));
  $('taMeta').textContent=m.join(' · ')||'—';
  $('taTime').value='';
  var b=$('taBtns'); b.innerHTML='';
  function mk(label,cls,fn){ var x=document.createElement('button');
    x.className='btn'+(cls?' '+cls:''); x.textContent=label; x.onclick=fn; b.appendChild(x) }

  $('taTimeLbl').textContent = (r.state==='ON') ? 'Clock-out time — blank means now' : 'Clock-in time — blank means now';
  $('taTimeWrap').style.display = (r.state==='ON'||r.state==='LATE'||r.state==='SOON') ? '' : 'none';

  if(r.state==='ON') mk('Clock out','',function(){ taPunch('out') });
  else               mk('Clock in','',function(){ $('taTimeWrap').style.display=''; taPunch('in') });

  if(r.state==='MISSED' && r.shiftId){
    mk('Remove no-show mark','danger',function(){
      confirmSheet({title:'Remove no-show?',danger:true,okText:'Remove',
        body:'Removes the MISSED record for '+taRow.name+'. The full row stays in Bot_Log.'},function(){
        api('dashDeleteShift',[taRow.shiftId,KEYV()],function(){ afterAct('No-show mark removed') });
      });
    });
  }
  if((r.state==='CALLIN'||r.state==='OFF') && r.excId){
    mk('Remove '+(r.state==='CALLIN'?'call-in':'off')+' mark','danger',function(){
      confirmSheet({title:'Remove mark?',danger:true,okText:'Remove',
        body:'Removes today’s '+(taRow.state==='CALLIN'?'call-in':'OFF')+' mark for '+taRow.name+'.'},function(){
        api('dashCancelException',[taRow.excId,KEYV()],function(){ afterAct('Mark removed') });
      });
    });
  }
  if(r.state!=='MISSED'&&r.state!=='DONE'&&r.state!=='ON'){
    mk('No-show','sec',function(){
      confirmSheet({title:'Mark no-show?',okText:'Mark missed',
        body:'Creates a 0-hour MISSED shift for '+taRow.name+' today.'},function(){
        api('dashPunch',[taRow.id,'missed','no-show',KEYV()],function(res){ afterAct(res.reply) });
      });
    });
  }
  if(r.state!=='CALLIN'&&r.state!=='DONE'&&r.state!=='ON'){
    mk('Call-in…','sec',function(){
      confirmSheet({title:'Record a call-in',okText:'Record',
        body:taRow.name+' called in for today.',
        input:{label:'Reason (required)',placeholder:'sick',required:true}},function(why){
        api('dashAddException',[taRow.id,B.today,B.today,'OFF','','','CALLIN: '+why,KEYV()],
          function(){ afterAct('Call-in recorded') });
      });
    });
  }
  if(r.state!=='OFF'&&r.state!=='CALLIN'&&r.state!=='DONE'&&r.state!=='ON'){
    mk('Off today…','sec',function(){
      confirmSheet({title:'Mark off today',okText:'Mark off',body:taRow.name+' is off today.',
        input:{label:'Reason (optional)',placeholder:'optional'}},function(why){
        api('dashAddException',[taRow.id,B.today,B.today,'OFF','','',why||'',KEYV()],
          function(){ afterAct('Marked off') });
      });
    });
  }
  if((r.state==='DONE'||r.state==='EXTRA') && r.shiftId){
    mk('Edit this shift','sec',function(){ openShiftFromBoard() });
  }
  openSheet('shAct');
}
function afterAct(msg){ toast(msg||'Saved'); closeSheets(); SH=null; loadInit(true,true) }
function taPunch(action){
  var t=$('taTime').value||'';

    toast(res.reply); closeSheets(); SH=null; TD=null; loadInit(true,false);
  }, false, action==='in'?'Clocking in':'Clocking out');
}

   PEOPLE — crew

function peopleTab(v){
  peopleView=v;
  $('segCrew').className = v==='crew'?'on':'';
  $('segAppl').className = v==='appl'?'on':'';
  $('pCrew').style.display = v==='crew'?'':'none';

function dispName(d){ return d.pref||d.first||d.full }
function renderCrew(){
  var v=$('pCrew'); if(!v||!B) return;
  v.innerHTML='';
  var act=B.roster.filter(function(d){ return /^active$/i.test(d.status) });
  var ina=B.roster.filter(function(d){ return !/^active$/i.test(d.status) });

    h.innerHTML='<span class="lbl">'+t+'</span><span class="n">'+n+'</span>'; v.appendChild(h) }

  head('Inactive',ina.length);

function crewCard(d){
  var el=document.createElement('div'); el.className='card';

    ? '<span class="pill warn">needs '+missing.join(', ')+'</span>'
    : '<span class="pill'+(/^active$/i.test(d.status)?' ok':' dim')+'">'+esc(d.role||'—')+'</span>';
  el.innerHTML='<div class="row"><span class="nm">'+esc(dispName(d))+
    (d.pref&&d.pref!==d.first?' <span style="font-weight:400;color:var(--ink3);font-size:12.5px">'+esc(d.full)+'</span>':'')+
    '</span>'+pill+'</div>'+

}
function openDriver(d){

  $('dSub').textContent=d.id;
  $('dPref').value=d.pref||''; $('dPhone').value=d.phone||''; $('dAlias').value='';

          role:$('dRole').value, tier:$('dTier').value, status:$('dStatus').value };

function addAlias(){

/* ==========================================================
   PEOPLE — applicants
   ========================================================== */
function loadAppl(quiet){
  api('dashApplicants',[KEYV()],function(res){
    APPL=(res&&res.applicants)||[];
    if(res&&res.stages&&res.stages.length) STAGES=res.stages;
    renderChips(); renderAppl(); applBadge();
  }, quiet!==false, 'Loading applicants');
}
function applBadge(){
  var d=$('applDot'); if(!d) return;
  var n=(APPL||[]).filter(function(a){ return a.stage!=='Rejected' }).length;
  if(n>0){ d.textContent=n; d.style.display='' } else { d.style.display='none' }
}
function renderChips(){
  var c=$('aChips'); c.innerHTML='';
  var counts={ALL:0}; STAGES.forEach(function(s){ counts[s]=0 });
  (APPL||[]).forEach(function(a){
    if(a.stage!=='Rejected') counts.ALL++;
    if(counts[a.stage]!==undefined) counts[a.stage]++;
  });
  var order=['ALL'].concat(STAGES);
  order.forEach(function(s){
    var b=document.createElement('button');
    b.className='chip'+(aFilter===s?' on':'');
    b.textContent=(s==='ALL'?'Open':s)+' '+(counts[s]||0);
    b.onclick=function(){ aFilter=s; renderChips(); renderAppl() };
    c.appendChild(b);
  });
}
function ageLabel(d){
  if(d==null) return '';
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  if(d<30) return d+'d ago';
  var m=Math.round(d/30.4);
  if(m<12) return m+' mo ago';
  var y=(d/365).toFixed(1);
  return y+' yr ago';
}
function renderAppl(){
  var v=$('aList'); if(!v) return;
  if(APPL===null){ v.innerHTML='<div class="empty">Loading…</div>'; return }
  var q=($('aSearch').value||'').trim().toLowerCase();
  var digits=q.replace(/\D/g,'');
  var pool=APPL.filter(function(a){
    if(aFilter==='ALL'){ if(a.stage==='Rejected') return false }
    else if(a.stage!==aFilter) return false;
    if(!q) return true;
    if(a.name.toLowerCase().indexOf(q)>=0) return true;
    if(digits && String(a.phone).replace(/\D/g,'').indexOf(digits)>=0) return true;
    return false;
  });
  pool.sort(function(x,y){
    var a=x.ageDays==null?99999:x.ageDays, b=y.ageDays==null?99999:y.ageDays;
    return a-b;
  });
  v.innerHTML='';
  if(!pool.length){
    v.innerHTML='<div class="empty">'+(q?'Nobody matches “'+esc(q)+'”.':'Nothing here.')+'</div>';
  } else {
    var h=document.createElement('div'); h.className='sec';
    h.innerHTML='<span class="lbl">'+(aFilter==='ALL'?'Open applications':aFilter)+'</span><span class="n">'+pool.length+'</span>';
    v.appendChild(h);
    pool.forEach(function(a){ v.appendChild(applCard(a)) });
  }
  // rejected, collapsed, only in the ALL view and only when unfiltered by search
  if(aFilter==='ALL' && !q){
    var rej=APPL.filter(function(a){ return a.stage==='Rejected' });
    if(rej.length){
      var rh=document.createElement('div'); rh.className='sec';
      rh.innerHTML='<span class="lbl">Rejected</span><span class="n">'+rej.length+'</span>';
      v.appendChild(rh);
      var box=document.createElement('div'); box.id='rejBox'; box.style.display='none';
      rej.forEach(function(a){ box.appendChild(applCard(a)) });
      var t=document.createElement('button');
      t.className='btn sec sm'; t.style.marginTop='0';
      t.textContent='Show '+rej.length+' rejected';
      t.onclick=function(){
        var open=box.style.display!=='none';
        box.style.display=open?'none':'';
        t.textContent=(open?'Show ':'Hide ')+rej.length+' rejected';
      };
      v.appendChild(t); v.appendChild(box);
    }
  }
}
function stagePillClass(s){
  return s==='Rejected'?'dim' : s==='Interviewed'?'ok' : s==='Contacted'?'info'
       : s==='Reviewing'?'purple' : '';
}
function applCard(a){
  var el=document.createElement('div'); el.className='card';
  var flags='';
  if(a.flags){
    if(a.flags.violations)     flags+='<span class="pill bad">disclosed</span> ';
    if(a.flags.suspension)     flags+='<span class="pill bad">suspension</span> ';
    if(a.flags.licenseExpired) flags+='<span class="pill warn">licence exp</span> ';
    if(a.flags.medExpired)     flags+='<span class="pill warn">med exp</span> ';
    if(a.flags.oldSchema)      flags+='<span class="pill dim">old form</span> ';
  }
  var docs='';
  if(a.docs){
    docs='<div class="docs">'+
      '<span class="dd'+(a.docs.app?' has':'')+'">app</span>'+
      '<span class="dd'+(a.docs.dl?' has':'')+'">licence</span>'+
      '<span class="dd'+(a.docs.med?' has':'')+'">med</span>'+
      '<span class="dd'+(a.docs.policies?' has':'')+'">policies</span>'+
      '</div>';
  }
  el.innerHTML=
    '<div class="row"><span class="nm">'+esc(a.name)+'</span>'+
      '<span class="pill '+stagePillClass(a.stage)+'">'+esc(a.stage)+'</span></div>'+
    '<div class="sub">'+
      esc(a.licenseType||'no licence listed')+
      (a.preferredShift?' · '+esc(a.preferredShift):'')+
      '</div>'+
    '<div class="sub2">'+esc(ageLabel(a.ageDays))+
      (a.appliedShort?' · '+esc(a.appliedShort):'')+
      (a.noteCount?' · '+a.noteCount+' note'+(a.noteCount>1?'s':''):'')+'</div>'+
    (flags?'<div style="margin-top:7px">'+flags+'</div>':'')+
    docs+
    (a.lastNote?'<div class="sub2" style="margin-top:7px;color:var(--ink2)">“'+esc(a.lastNote)+'”</div>':'');
  el.onclick=function(){ openApplicant(a.id) };
  return el;
}

/* ---------- applicant detail ---------- */
function openApplicant(id){
  api('dashApplicant',[id,KEYV()],function(d){
    APDET=d;

    var sub=[d.stage];
    if(d.meta&&d.meta.ageDays!=null) sub.push('applied '+ageLabel(d.meta.ageDays));

function ico(n){

    doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',

    med:'<rect x="3" y="6.5" width="18" height="13" rx="2"/><path d="M9 6.5V5a2 2 0 012-2h2a2 2 0 012 2v1.5"/><path d="M12 10v6M9 13h6"/>',

function docBtn(url,icon,label,warn){
  var badge = warn ? '<span class="pill bad" style="margin-top:3px">'+warn+'</span>' : '';
  if(!url) return '<div class="docbtn none"><span class="ic">'+ico(icon)+'</span>'+label+'</div>';
  return '<a class="docbtn" href="'+esc(url)+'" target="_blank" rel="noopener">'+
         '<span class="ic">'+ico(icon)+'</span>'+label+badge+'</a>';
}
function kv(k,v,muted){
  return '<div class="kv"><span class="k">'+k+'</span><span class="v'+(muted?' muted':'')+'">'+v+'</span></div>';
}
function applBody(d){
  var h='';
  var c=d.contact||{}, L=d.license||{}, M=d.medical||{}, S=d.screening||{}, W=d.work||{}, P=d.policy||{}, G=d.logistics||{};

  /* --- what Fino decides on: documents first --- */
  h+='<div class="block"><span class="lbl">Documents</span><div class="docgrid">'+
      docBtn(d.docs&&d.docs.app,'doc','Application')+
      docBtn(d.docs&&d.docs.dl,'id','Licence',L.expired?'expired':'')+
      docBtn(d.docs&&d.docs.med,'med','Med card',M.expired?'expired':'')+
      docBtn(d.docs&&d.docs.policies,'check','Policies')+
      (d.docs&&d.docs.extra?docBtn(d.docs.extra,'clip','Extra'):'')+
     '</div></div>';

  /* --- then contact + logistics --- */
  var tel=String(c.phone||'').replace(/[^\d+]/g,'');
  h+='<div class="block"><span class="lbl">Contact</span>';
  if(tel){
    h+='<div class="actgrid">'+
        '<a class="docbtn" href="tel:'+esc(tel)+'"><span class="ic">'+ico('phone')+'</span>Call</a>'+
        '<a class="docbtn" href="sms:'+esc(tel)+'"><span class="ic">'+ico('sms')+'</span>Text</a>'+
        (c.email?'<a class="docbtn" href="mailto:'+esc(c.email)+'"><span class="ic">'+ico('mail')+'</span>Email</a>':
                 '<div class="docbtn none"><span class="ic">'+ico('mail')+'</span>Email</div>')+
       '</div>';
  }
  h+=kv('Phone',esc(c.phone||'—'));
  h+=kv('Email',esc(c.email||'—'));
  var addr=[c.address,c.city,c.state,c.zip].filter(Boolean).join(', ');
  h+=kv('Address',addr?esc(addr):'<span class="v muted">not collected</span>');
  h+=kv('Shift',esc(G.preferredShift||'—'));
  h+=kv('Shirt',esc(G.shirtSize||'—'));
  h+='</div>';

  /* --- licence + medical, with expiry called out --- */
  h+='<div class="block"><span class="lbl">Licence &amp; medical</span>';
  h+=kv('Type',esc(L.type||'—'));
  h+=kv('Number',esc(L.number||'—'));
  h+=kv('State',esc(L.state||'—'));
  h+=kv('Licence exp', L.exp?(esc(L.exp)+(L.expired?' <span class="pill bad" style="margin-left:6px">expired</span>':'')):'—');
  h+=kv('Med card exp', M.cardExp?(esc(M.cardExp)+(M.expired?' <span class="pill bad" style="margin-left:6px">expired</span>':'')):'<span class="v muted">not on file</span>');
  if(M.examinerNumber) h+=kv('Examiner #',esc(M.examinerNumber));
  h+='</div>';

  /* --- screening: blank must never read as clean --- */
  h+='<div class="block"><span class="lbl">Screening</span>';
  if(!S.collected){
    h+='<div class="warnbox">This application predates the current form. The violation and '+
       'suspension questions were never asked — this is <b>not</b> a clean record, it is no record. '+
       'Ask before hiring.</div>';
  } else {
    if(!S.violationsClean && S.violations3yr){
      h+='<div class="badbox"><b>Violations disclosed · 3 yr</b>'+esc(S.violations3yr)+'</div>';
    } else {
      h+=kv('Violations · 3 yr','<span class="pill ok">none disclosed</span>');
    }
    if(S.suspensionFlag){
      h+='<div class="badbox"><b>Licence suspended · 5 yr</b>'+
         esc(S.suspensionExplain||'no explanation given')+'</div>';
    } else {
      h+=kv('Suspended · 5 yr','<span class="pill ok">no</span>');
    }
  }
  h+='</div>';

  /* --- work history --- */
  h+='<div class="block"><span class="lbl">Work history</span>';
  if(W.employers&&W.employers.length){
    W.employers.forEach(function(e){
      h+='<div class="emp"><div class="nm" style="font-size:14px">'+esc(e.company||'—')+'</div>'+
         '<div class="sub2">'+esc(e.position||'')+
         ((e.from||e.to)?' · '+esc(e.from||'?')+' – '+esc(e.to||'?'):'')+'</div>'+
         (e.reason?'<div class="sub2">Left: '+esc(e.reason)+'</div>':'')+
         (e.phone?'<div class="sub2"><a href="tel:'+esc(String(e.phone).replace(/[^\d+]/g,''))+'" style="border-bottom:1px solid var(--line2)">'+esc(e.phone)+'</a></div>':'')+
         '</div>';
    });
  } else { h+='<div class="sub2">No employers listed.</div>' }
  if(W.experienceNotes){
    h+='<div class="emp"><span class="lbl">Their notes</span><div class="sub" style="margin-top:5px">'+esc(W.experienceNotes)+'</div></div>';
  }
  h+='</div>';

  /* --- application meta --- */
  h+='<div class="block"><span class="lbl">Application</span>';
  h+=kv('Applied', esc((d.meta&&d.meta.applied)||'—')+(d.meta&&d.meta.ageDays!=null?' <span class="v muted">· '+esc(ageLabel(d.meta.ageDays))+'</span>':''));
  h+=kv('Source',esc((d.meta&&d.meta.source)||'—'));
  var pv=String(P.version||'?'); if(!/^v/i.test(pv)) pv='v'+pv;   // old versions already start with "v"
  h+=kv('Policies', P.accepted?('signed '+esc(P.signedAt||'')+' · '+esc(pv)):'<span class="v muted">not signed</span>');
  h+=kv('Applicant ID','<span style="font-family:ui-monospace,monospace;font-size:12px">'+esc(d.id)+'</span>');
  h+='</div>';

  /* --- notes --- */
  h+='<div class="block"><span class="lbl">Internal notes</span>';
  if(d.notes&&d.notes.length){
    d.notes.slice().reverse().forEach(function(n){
      h+='<div class="note"><div class="meta">'+esc(n.at||'')+(n.who?' · '+esc(n.who):'')+'</div>'+
         '<div class="txt">'+esc(n.text)+'</div></div>';
    });
  } else { h+='<div class="sub2">Nothing recorded yet.</div>' }
  h+='<button class="btn sec sm" onclick="openNote()">Add note</button></div>';

  /* --- actions --- */
  h+='<div class="block"><span class="lbl">Move to</span><div class="chips wrap" style="padding-bottom:2px">';
  STAGES.forEach(function(s){
    if(s===d.stage) return;
    h+='<button class="chip" onclick="openStage(\''+s+'\')">'+s+'</button>';
  });
  h+='</div></div>';
  if(B && B.canSettings){
    h+='<button class="btn" onclick="doHire()">Hire '+esc(d.first||d.name)+'</button>';
  }
  return h;
}

  closeSheets(); openSheet('shNote');
}
function saveNote(){
  var t=$('noteText').value.trim();
  if(!t){ toast('Nothing to save',true); return }
  api('dashApplicantNote',[noteTarget,t,KEYV()],function(){
    toast('Note added'); closeSheets(); APPL=null; loadAppl(true);
    openApplicant(noteTarget);
  }, false, 'Saving note');
}
function openStage(s){
  stageTarget={id:APDET.id, name:APDET.name, stage:s};
  $('stageTitle').textContent='Move to '+s;
  $('stageSub').textContent=APDET.name+' · currently '+APDET.stage;
  $('stageNote').value='';
  closeSheets(); openSheet('shStage');
}
function saveStage(){
  var n=$('stageNote').value.trim();
  api('dashSetApplicantStage',[stageTarget.id,stageTarget.stage,n,KEYV()],function(r){
    toast(r.from+' → '+r.stage); closeSheets();
    APPL=null; loadAppl(true); openApplicant(stageTarget.id);
  }, false, 'Saving');
}
function doHire(){
  var d=APDET;
  confirmSheet({title:'Hire '+d.name+'?',okText:'Hire',
    body:'Creates their Driver record, DQF folder and compliance checklist. This is the same path the sheet menu uses.'},
    function(){
      api('dashHire',[d.id,KEYV()],function(res){
        toast(res.reply||'Hired'); closeSheets();
        APPL=null; loadAppl(true); loadInit(true,true);
      }, false, 'Hiring');
    });
}

/* ==========================================================
   SCHEDULE
   ========================================================== */
function renderSched(){
  var p=$('picker'); if(!p||!B) return;
  p.innerHTML='';
  B.roster.filter(function(d){ return /^active$/i.test(d.status) }).forEach(function(d){
    var c=document.createElement('button');
    c.className='chip'+(d.id===selDriver?' on':'');
    c.textContent=dispName(d);
    c.onclick=function(){ selDriver=d.id; renderSched() };
    p.appendChild(c);
  });
  var w=$('week'); w.innerHTML='';
  DAYS.forEach(function(day){
    var row=B.schedule.filter(function(s){ return s.driverId===selDriver && s.day===day })[0];
    var el=document.createElement('div'); el.className='day';
    el.innerHTML='<span class="dd2">'+DAYNAMES[day]+'</span>'+
      (row?'<span class="tt">'+fmtT(row.start)+' – '+fmtT(row.end)+'</span><span class="un">'+
            (row.unit?'truck '+fmtTruck(row.unit):'')+'</span>'
          :'<span class="tt off">not scheduled</span><span class="un"></span>');
    el.onclick=function(){ openDay(day,row) };
    w.appendChild(el);
  });
  var ex=$('excList'); ex.innerHTML='';
  var up=B.exceptions.filter(function(e){ return e.driverId===selDriver });
  if(!up.length){ ex.innerHTML='<div class="empty">Nothing filed.</div>'; return }
  up.forEach(function(e){
    var el=document.createElement('div'); el.className='exline';
    var when=e.date.slice(5).replace('-','/');
    var what=e.type==='OFF'?'OFF':(e.type.replace('_',' ').toLowerCase()+' '+fmtT(e.start)+'–'+fmtT(e.end));
    el.innerHTML='<span style="font-size:13.5px"><b>'+esc(shortName(e.driverId,e.driver))+'</b> · '+when+' · '+what+
      (e.reason?'<div class="sub2">'+esc(e.reason)+'</div>':'')+'</span><span class="x">&times;</span>';
    el.querySelector('.x').onclick=function(){
      confirmSheet({title:'Remove exception?',danger:true,okText:'Remove',
        body:e.driver+' · '+what+' on '+when},function(){
        api('dashCancelException',[e.id,KEYV()],function(){ toast('Removed'); TD=null; loadInit(true,false) });
      });
    };
    ex.appendChild(el);
  });
}
function shortName(id,fb){ var d=B.roster.filter(function(x){ return x.id===id })[0]; return d?dispName(d):fb }
function openDay(day,row){
  editDay=day;
  var d=B.roster.filter(function(x){ return x.id===selDriver })[0];
  $('dayTitle').textContent=dispName(d);
  $('dayStart').value=row?row.start:'07:00';
  $('dayEnd').value=row?row.end:'19:00';
  var us=$('dayUnit'); us.innerHTML='<option value="">— none —</option>';
  B.units.forEach(function(u){
    var o=document.createElement('option'); o.value=u; o.textContent='truck '+fmtTruck(u);
    if(row&&row.unit===u) o.selected=true; us.appendChild(o);
  });
  var dc=$('dayChips'); dc.innerHTML='';
  DAYS.forEach(function(dd){
    var c=document.createElement('button');
    c.className='chip'+(dd===day?' on':'');
    c.textContent=DAYNAMES[dd]; c.dataset.day=dd;
    c.onclick=function(){ c.className='chip'+(/ on/.test(c.className)?'':' on') };
    dc.appendChild(c);
  });
  openSheet('shDay');
}
function pickedDays(){
  return [].slice.call($('dayChips').querySelectorAll('.chip.on')).map(function(c){ return c.dataset.day });
}
function saveDay(){
  var s=$('dayStart').value, e=$('dayEnd').value;
  if(!s||!e){ toast('Need start and end',true); return }
  var days=pickedDays();
  if(!days.length){ toast('Pick at least one day',true); return }
  var unit=$('dayUnit').value;
  api('dashSetScheduleWeek',[selDriver,days,s,e,unit,KEYV()],function(r){
    days.forEach(function(dd){
      B.schedule=B.schedule.filter(function(x){ return !(x.driverId===selDriver&&x.day===dd) });
      B.schedule.push({id:'',driverId:selDriver,day:dd,start:s,end:e,unit:unit});
    });
    toast('Saved '+r.filed+' day'+(r.filed>1?'s':'')); closeSheets(); TD=null; renderSched();
  }, false, 'Filing schedule');
}
function clearDay(){
  var d=B.roster.filter(function(x){ return x.id===selDriver })[0];
  var days=pickedDays(); if(!days.length) days=[editDay];
  confirmSheet({title:'Clear those days?',danger:true,okText:'Clear',
    body:dispName(d)+' — '+days.map(function(x){return DAYNAMES[x]}).join(', ')+'. Not scheduled going forward.'},
    function(){
      var run=function(i){
        if(i>=days.length){
          days.forEach(function(dd){ B.schedule=B.schedule.filter(function(x){ return !(x.driverId===selDriver&&x.day===dd) }) });
          toast('Cleared'); closeSheets(); TD=null; renderSched(); return;
        }
        api('dashClearScheduleDay',[selDriver,days[i],KEYV()],function(){ run(i+1) },false,'Clearing');
      };
      run(0);
    });
}
function openExc(){
  var ds=$('excDriver'); ds.innerHTML='';
  B.roster.filter(function(d){ return /^active$/i.test(d.status) }).forEach(function(d){
    var o=document.createElement('option'); o.value=d.id; o.textContent=dispName(d);
    if(d.id===selDriver) o.selected=true; ds.appendChild(o);
  });
  $('excFrom').value=B.today; $('excTo').value=B.today;
  $('excType').value='OFF'; excTypeChange(); $('excReason').value='';
  $('excSub').textContent='Same day in both boxes files one day.';
  openSheet('shExc');
}
function excTypeChange(){ $('excTimes').style.display = $('excType').value==='OFF'?'none':'flex' }
function fileExc(){
  if(BUSY) return;
  var t=$('excType').value, f=$('excFrom').value, to=$('excTo').value||f;
  if(!f){ toast('Need a from date',true); return }
  if(t!=='OFF' && (!$('excStart').value||!$('excEnd').value)){ toast('Need start and end times',true); return }
  var n=Math.round((new Date(to)-new Date(f))/86400000)+1;
  api('dashAddException',
    [$('excDriver').value,f,to,t,$('excStart').value,$('excEnd').value,$('excReason').value.trim(),KEYV()],
    function(r){
      var m=[];
      if(r.filed) m.push('Filed '+r.filed+' day'+(r.filed>1?'s':''));
      if(r.replaced) m.push(r.replaced+' replaced');
      if(r.skipped) m.push(r.skipped+' already filed');
      toast(m.join(' · ')||'Nothing to change');
      closeSheets(); SH=null; TD=null; loadInit(true,false);
    }, false, n>1?('Filing '+n+' days'):'Filing');
}

/* ==========================================================
   SHIFTS
   ========================================================== */
function loadShifts(){
  api('dashShifts',[wkOff,KEYV()],function(s){
    SH=s; if(!selShiftDriver) selShiftDriver=selDriver; renderShifts();
  }, false, 'Loading shifts');
}
function wkNav(d){ if(wkOff+d>0) return; wkOff+=d; SH=null; loadShifts() }
function renderShifts(){
  $('wkLabel').textContent=(wkOff===0?'This week · ':wkOff===-1?'Last week · ':'')+SH.label;
  $('wkFwd').disabled=(wkOff===0);
  var p=$('pickerH'); p.innerHTML='';
  B.roster.filter(function(d){ return /^active$/i.test(d.status) }).forEach(function(d){
    var c=document.createElement('button');
    c.className='chip'+(d.id===selShiftDriver?' on':'');
    var tot=SH.totals[d.id];
    c.textContent=dispName(d)+(tot?' · '+tot+'h':'');
    c.onclick=function(){ selShiftDriver=d.id; renderShifts() };
    p.appendChild(c);
  });
  var v=$('shiftList'); v.innerHTML='';
  var rows=SH.shifts.filter(function(s){ return s.driverId===selShiftDriver });
  if(!rows.length){ v.innerHTML='<div class="empty">No shifts recorded this week.</div>'; return }
  rows.forEach(function(s){
    var el=document.createElement('div'); el.className='card';
    var dd=s.date.slice(5).replace('-','/');
    var dayNice=s.day.charAt(0)+s.day.slice(1).toLowerCase();
    var times=(s.inT?fmtT(s.inT):'—')+' – '+(s.outT?fmtT(s.outT)+(s.outNextDay?' +1d':''):'…');
    var tag='';
    if(s.status==='OPEN') tag=' <span class="pill warn">open</span>';
    if(s.status==='CLOSED' && !s.hours) tag=' <span class="pill bad">0.0h</span>';
    el.innerHTML='<div class="row"><span class="nm" style="font-size:15px">'+dayNice+' '+dd+tag+'</span>'+
      '<span class="nm mono" style="font-size:15px">'+(s.status==='CLOSED'&&s.hours?s.hours+'h':'')+'</span></div>'+
      '<div class="sub">'+times+(s.unit?' · truck '+fmtTruck(s.unit):'')+'</div>'+
      (s.notes?'<div class="sub2">'+esc(s.notes)+'</div>':'');
    el.onclick=function(){ openShift(s) };
    v.appendChild(el);
  });
  var t=document.createElement('div'); t.className='sec';
  t.innerHTML='<span class="lbl">Week total</span><span class="n">'+(SH.totals[selShiftDriver]||0)+'h</span>';
  v.appendChild(t);
}
function openShift(s){
  editShift=s;
  var d=B.roster.filter(function(x){ return x.id===s.driverId })[0];
  var dayNice=s.day.charAt(0)+s.day.slice(1).toLowerCase();
  $('sTitle').textContent=(d?dispName(d):s.driverId);
  $('sMeta').textContent=dayNice+' '+s.date.slice(5).replace('-','/')+' · '+s.id+' · '+s.status+
    (s.outNextDay?' · clock-out lands next day':'');
  $('sIn').value=s.inT||''; $('sOut').value=s.outT||''; $('sReason').value='';
  $('sReopen').style.display = s.status==='CLOSED'?'':'none';
  openSheet('shShift');
}
function saveShift(){
  var s=editShift, iv=$('sIn').value, ov=$('sOut').value, why=$('sReason').value.trim();
  var jobs=[];
  if(iv && iv!==s.inT) jobs.push(['clock_in',iv]);
  if(ov && ov!==s.outT) jobs.push(['clock_out',ov]);
  if(!jobs.length){ toast('No time changes',true); return }
  var run=function(i){
    if(i>=jobs.length){ toast('Saved'); closeSheets(); SH=null; TD=null; loadShifts(); return }
    api('dashFixShiftTime',[s.id,jobs[i][0],jobs[i][1],why,KEYV()],function(){ run(i+1) },false,'Saving');
  };
  run(0);
}
function reopenShift(){
  var s=editShift;
  confirmSheet({title:'Reopen shift?',okText:'Reopen',
    body:'Clears the clock-out and hours. Record only — it does not put them back on the live clock.'},
    function(){
      api('dashReopenShift',[s.id,KEYV()],function(){
        toast('Reopened'); closeSheets(); SH=null; TD=null; loadShifts();
      }, false, 'Reopening');
    });
}
function deleteShift(){
  var s=editShift;
  confirmSheet({title:'Delete this shift?',danger:true,okText:'Delete',
    body:(s.hours?s.hours+'h on ':'')+(s.date||'')+'. The full row stays in Bot_Log, but it disappears from payroll.'},
    function(){
      api('dashDeleteShift',[s.id,KEYV()],function(){
        toast('Deleted'); closeSheets(); SH=null; TD=null;
        if(daySel) loadDay(daySel); else loadShifts();
      }, false, 'Deleting');
    });
}

/* ==========================================================
   SETTINGS
   ========================================================== */
function loadCfg(){ api('dashConfigList',[KEYV()],function(c){ CFG=c; renderCfg() },false,'Loading settings') }
function renderCfg(){
  var v=$('cfgList'); v.innerHTML='';
  if(!CFG.knobs.length){ v.innerHTML='<div class="empty">No settings found.</div>'; return }
  CFG.knobs.forEach(function(kn){
    var el=document.createElement('div');
    el.className='knob'+(kn.type==='locked'?' locked':'');
    el.innerHTML='<button class="info">i</button>'+
      '<div class="kd">'+esc(kn.label)+(kn.type==='locked'?' &#128274;':'')+'</div>'+
      '<div class="kk">'+esc(kn.key)+'</div>';
    var help=document.createElement('div'); help.className='help'; help.textContent=kn.help||'';
    el.appendChild(help);
    el.querySelector('.info').onclick=function(ev){
      ev.stopPropagation(); help.className='help'+(/ on/.test(help.className)?'':' on');
    };
    var row=document.createElement('div'); row.className='krow';
    if(kn.type==='toggle'){
      var on=kn.value.trim().toLowerCase()===String(kn.valOn).toLowerCase();
      var sw=document.createElement('div'); sw.className='sw'+(on?' on':'');
      var lb=document.createElement('span');
      lb.style.cssText='font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:'+(on?'var(--ok)':'var(--ink3)');
      lb.textContent=on?'On':'Off';
      sw.onclick=function(){
        confirmSheet({title:'Turn '+(on?'off':'on')+'?',okText:on?'Turn off':'Turn on',danger:on,
          body:kn.label+' — this changes live system behaviour.'},function(){
          api('dashSetConfig',[kn.key,on?kn.valOff:kn.valOn,KEYV()],function(){
            toast(kn.label+' '+(on?'off':'on')); CFG=null; loadCfg();
          }, false, 'Saving');
        });
      };
      row.appendChild(sw); row.appendChild(lb);
    } else if(kn.type==='enum'){
      row.className='enum';
      kn.options.forEach(function(opt){
        var c=document.createElement('button');
        var cur=kn.value.trim().toUpperCase()===String(opt).toUpperCase();
        c.className='echip'+(cur?' on':''); c.textContent=opt;
        c.onclick=function(){
          if(cur) return;
          confirmSheet({title:'Set to '+opt+'?',okText:'Set '+opt,
            body:kn.label+' — this changes live system behaviour.'},function(){
            api('dashSetConfig',[kn.key,opt,KEYV()],function(){
              toast(kn.label+' → '+opt); CFG=null; loadCfg();
            }, false, 'Saving');
          });
        };
        row.appendChild(c);
      });
    } else if(kn.type==='number' || kn.type==='text'){
      var inp=document.createElement('input');
      inp.value=kn.value; inp.type = kn.type==='number'?'number':'text';
      if(kn.type==='number'){ inp.inputMode='numeric';
        if(kn.min!=null) inp.min=kn.min; if(kn.max!=null) inp.max=kn.max }
      var bt=document.createElement('button'); bt.className='kbtn'; bt.textContent='Save';
      bt.onclick=function(){
        var nv=inp.value.trim();
        if(nv===kn.value){ toast('No change'); return }
        confirmSheet({title:'Change setting?',okText:'Save',
          body:kn.label+' → '+nv},function(){
          api('dashSetConfig',[kn.key,nv,KEYV()],function(){ toast('Saved'); CFG=null; loadCfg() },false,'Saving');
        });
      };
      row.appendChild(inp); row.appendChild(bt);
    } else {
      var lv=document.createElement('div'); lv.className='lockval';
      lv.textContent=kn.value||'(blank)'; row.appendChild(lv);
    }
    el.appendChild(row);
    v.appendChild(el);
  });
}

/* ==========================================================
   UTIL + LIFECYCLE
   ========================================================== */
function fillSel(id,opts,cur){
  var s=$(id); s.innerHTML='';
  if(!cur){ var o=document.createElement('option'); o.value=''; o.textContent='— pick —'; s.appendChild(o) }
  opts.forEach(function(v){
    var o=document.createElement('option'); o.value=v; o.textContent=v;
    if(v===cur) o.selected=true; s.appendChild(o);
  });
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && CRED && Date.now()-lastInitAt>60000){
    renderFoot(true); loadInit(false,true);
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheets() });

initAuth();
